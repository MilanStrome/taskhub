      : WEEKDAYS[weekdayOfKey(k)] + ' · ' + fmtDate(k);
    const g = groups[k].slice().sort((a, b) => new Date(b.completedAt || 0) - new Date(a.completedAt || 0));
    view.appendChild(groupHead(label, g.length, 'var(--st-done)'));
    view.appendChild(TaskUI.list(g, { noSwipe:true, rightNode:restoreBtn }));
  });

  mount.appendChild(view);
};

/* ------------------------------------------------------------
   P4. SYNC ENGINE - Google Sheets via Apps Script
   Offline-first queue · per-task newer-wins merge · polling
   ------------------------------------------------------------ */
const Sync = (function(){
  const EPOCH = '1970-01-01T00:00:00.000Z';
  let timer = null;
  let syncing = false;
  let lastError = null;
  let pushDebounce = null;

  function url(){ return (Store.get('scriptUrl') || '').trim(); }
  function enabled(){ return !!url(); }

  /* text/plain body avoids the CORS preflight Apps Script can't answer;
     redirect:"follow" rides the script.googleusercontent.com hop */
  async function api(payload){
    if (!url()) throw new Error('No script URL configured');
    const res = await fetch(url(), {
      method:'POST',
      redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error('Bad response - check the deployment (Web app, access: Anyone)'); }
    if (!data || data.ok !== true) throw new Error((data && data.error) || 'Server error');
    return data;
  }

  /* ---- defensive shaping of anything that comes back from the Sheet ---- */
  function toBool(v){ return v === true || v === 'true' || v === 'TRUE' || v === 1 || v === '1'; }

  function normalizeTask(r){
    if (!r || !r.id || typeof r.id !== 'string') return null;
    const arr = v => (Array.isArray(v) ? v : []);
    const who = w => (w === 'Boss' ? 'partner' : String(w || ''));
    const rec = (r.recurrence && r.recurrence.type &&
                 ['daily','weekly','monthly'].indexOf(r.recurrence.type) !== -1)
      ? { type: r.recurrence.type, interval: clamp(+r.recurrence.interval || 1, 1, 99) }
      : null;
    return {
      id: r.id,
      title: String(r.title || ''),
      notes: String(r.notes || ''),
      status: ['todo','inprogress','waiting','done'].indexOf(r.status) !== -1 ? r.status : 'todo',
      priority: ['high','medium','low'].indexOf(r.priority) !== -1 ? r.priority : 'medium',
      category: String(r.category || 'cat_general'),
      dueDate: r.dueDate ? String(r.dueDate).slice(0, 10) : null,
      assignedBy: who(r.assignedBy),
      createdBy: who(r.createdBy),
      pinned: toBool(r.pinned),
      personal: false,                       /* remote tasks are never personal */
      recurrence: rec,
      subtasks: arr(r.subtasks).filter(x => x && typeof x.text === 'string')
        .map(x => ({ id: String(x.id || uid('st')), text: x.text, done: !!x.done })),
      links: arr(r.links).filter(l => l && /^https?:\/\//i.test(String(l.url || '')))
        .map(l => ({ label: String(l.label || ''), url: String(l.url) })),
      attachments: arr(r.attachments).filter(a => a && /^https?:\/\//i.test(String(a.driveUrl || ''))),
      comments: arr(r.comments).map(c => Object.assign({}, c, { author: who(c.author) })),
      activity: arr(r.activity).map(a => Object.assign({}, a, { who: who(a.who) })),
      createdAt: String(r.createdAt || EPOCH),
      updatedAt: String(r.updatedAt || r.createdAt || EPOCH),
      completedAt: r.completedAt ? String(r.completedAt) : null,
      deleted: toBool(r.deleted)
    };
  }

  /* ---- merge: per-task, newer updatedAt wins ---- */
  function applyRemote(remote){
    const local = Store.getTask(remote.id);
    if (local && local.personal) return false;         /* never clobber a personal task */
    if (!local){
      if (remote.deleted) return false;                /* nothing local to delete */
      Store.tasks().push(remote);
      return true;
    }
    if (String(remote.updatedAt) > String(local.updatedAt)){
      const i = Store.tasks().indexOf(local);
      Store.tasks()[i] = remote;
      const q = Store.metaGet('pendingSync');
      const qi = q.indexOf(remote.id);
      if (qi !== -1){ q.splice(qi, 1); Store.saveMeta(); }   /* remote superseded our queued edit */
      return true;
    }
    return false;                                      /* local newer or equal - keep, stays queued */
  }

  function applyRemoteConfig(cfg){
    if (!cfg || !cfg.partnerName || !cfg.at) return;
    const localAt = Store.metaGet('partnerNameAt') || EPOCH;
    if (String(cfg.at) > String(localAt)){
      Store.setMany({ partnerName: String(cfg.partnerName) });
      Store.metaMerge({ partnerNameAt: String(cfg.at), configDirty: false });
      Shell.renderIdentityChip();
    }
  }

  /* ---- push pending (personal excluded), adopt conflicts ---- */
  async function push(){
    const q = Store.metaGet('pendingSync');
    for (let i = q.length - 1; i >= 0; i--){          /* drop stale / personal ids */
      const t = Store.getTask(q[i]);
      if (!t || t.personal) q.splice(i, 1);
    }
    Store.saveMeta();
    const tasks = q.map(id => Store.getTask(id)).filter(Boolean);
    if (!tasks.length && !Store.metaGet('configDirty')) return 0;

    const sentStamps = {};
    const payload = tasks.map(t => {
      sentStamps[t.id] = t.updatedAt;
      const c = clone(t);
      delete c.personal;
      /* pending uploads have no Drive URL yet - links only, never placeholders */
      c.attachments = (c.attachments || []).filter(a => a && !a.pending && a.driveUrl);
      return c;
    });
    const res = await api({
      action:'push',
      tasks: payload,
      config: { partnerName: Store.get('partnerName') || 'Boss',
                at: Store.metaGet('partnerNameAt') || EPOCH }
    });

    let changed = 0;
    (res.conflicts || []).forEach(rt => {
      const n = normalizeTask(rt);
      if (n && applyRemote(n)) changed++;
    });

    const q2 = Store.metaGet('pendingSync');
    Object.keys(sentStamps).forEach(id => {
      const t = Store.getTask(id);
      if (t && t.updatedAt !== sentStamps[id]) return;   /* edited mid-flight, keep queued */
      const i = q2.indexOf(id);
      if (i !== -1) q2.splice(i, 1);
    });
    Store.metaSet('configDirty', false);
    Store.saveMeta();
    if (changed){ Store.saveTasks(); Store.emit('tasks'); }
    applyRemoteConfig(res.config);
    return tasks.length;
  }

  /* ---- pull all, merge, detect new-from-partner ---- */
  async function pull(){
    const res = await api({ action:'pull' });
    const me = Store.identity();
    const baseline = Store.metaGet('lastSeenAt');      /* null → first pull, no badge flood */
    let changed = 0;
    const fresh = [];
    (res.tasks || []).forEach(rt => {
      const n = normalizeTask(rt);
      if (!n) return;
      const wasNew = !Store.getTask(n.id);
      if (applyRemote(n)){
        changed++;
        if (wasNew && baseline && !n.deleted && n.createdBy !== me &&
            String(n.createdAt) > String(baseline)){
          fresh.push(n);
        }
      }
    });
    applyRemoteConfig(res.config);
    if (changed){ Store.saveTasks(); Store.emit('tasks'); }
    if (fresh.length){
      Store.metaSet('bossBadge', (Store.metaGet('bossBadge') || 0) + fresh.length);
      Shell.setBossBadge(Store.metaGet('bossBadge'));
      Toast.show(fresh.length === 1
        ? displayName('partner') + ' added: ' + fresh[0].title
        : fresh.length + ' new tasks from ' + displayName('partner') + '.');
      if (typeof Notify !== 'undefined' && Notify.onPartnerTasks) Notify.onPartnerTasks(fresh);
    }
    Store.metaSet('lastSeenAt', String(res.serverTime || nowISO()));
    return changed;
  }

  /* ---- orchestration ---- */
  async function syncNow(manual){
    if (syncing || !enabled()){ refreshStatus(); return; }
    if (!navigator.onLine){
      refreshStatus();
      if (manual) Toast.show('Offline - changes are queued and will sync when back online.');
      return;
    }
    syncing = true;
    Shell.setSync('syncing', 'Syncing…');
    const wasError = !!lastError;
    try{
      await push();
      await pull();
      lastError = null;
      Store.metaSet('lastSync', nowISO());
    }catch(err){
      lastError = String(err && err.message || err);
      console.warn('[TaskHub] sync failed:', lastError);
      if (manual || !wasError){
        Toast.show('Sync failed: ' + lastError, {
          kind:'error', duration:6000,
          actionLabel:'Retry', action: () => syncNow(true)
        });
      }
    }
    syncing = false;
    refreshStatus();
  }

  function refreshStatus(){
    if (!enabled()){ Shell.setSync('off', 'Local'); return; }
    if (syncing){ Shell.setSync('syncing', 'Syncing…'); return; }
    if (lastError){ Shell.setSync('error', 'Error'); return; }
    const pend = Store.metaGet('pendingSync').length;
    if (!navigator.onLine){ Shell.setSync('pending', pend ? pend + ' queued' : 'Offline'); return; }
    if (pend){ Shell.setSync('pending', pend + ' pending'); return; }
    Shell.setSync('ok', Store.metaGet('lastSync') ? 'Synced' : 'Ready');
  }

  function schedule(){
    clearInterval(timer);
    if (!enabled()) return;
    const sec = clamp(+Store.get('syncInterval') || 60, 30, 300);
    timer = setInterval(() => { if (!document.hidden) syncNow(false); }, sec * 1000);
  }

  function requestSync(){                      /* debounced push after local edits */
    clearTimeout(pushDebounce);
    pushDebounce = setTimeout(() => syncNow(false), 4000);
  }

  function clearBadge(){
    if ((Store.metaGet('bossBadge') || 0) > 0){
      Store.metaSet('bossBadge', 0);
      Shell.setBossBadge(0);
    }
  }

  /* ---- share config string ---- */
  function makeConfigString(){
    const obj = { u: url(), p: Store.get('partnerName') || 'Boss' };
    return 'THCFG1.' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  }

  function applyConfigString(str){
    try{
      str = String(str || '').trim();
      if (str.indexOf('THCFG1.') !== 0) return 'Not a TaskHub config string.';
      const obj = JSON.parse(decodeURIComponent(escape(atob(str.slice(7)))));
      if (!obj.u || !/^https:\/\//.test(obj.u)) return 'Config has no valid URL.';

})();

/* ------------------------------------------------------------
   P5. ATTACHMENTS - Drive upload via Apps Script
   Bytes never touch the Sheet or localStorage: base64 waits in
   IndexedDB until uploaded, then only {driveUrl, thumbUrl} syncs.
   ------------------------------------------------------------ */
const Attach = (function(){
  const MAX_FILE  = 10 * 1024 * 1024;   /* Apps Script POST safety (spec) */
  const MAX_QUEUE = 40 * 1024 * 1024;   /* offline queue cap */
  const DB_NAME = 'taskhub-files', STORE = 'queue';

  let dbPromise = null;
  let processing = false;
  let subs = [];
  const memQueue = new Map();           /* fallback when IndexedDB unavailable */
  let useMem = !window.indexedDB;

  /* ---- tiny IndexedDB layer ---- */
  function db(){
    if (useMem) return Promise.reject(new Error('no idb'));
    if (!dbPromise){
      dbPromise = new Promise((res, rej) => {
        const rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore(STORE, { keyPath:'qid' });
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      }).catch(e => { useMem = true; throw e; });
    }
    return dbPromise;
  }
  function tx(mode, fn){
    return db().then(d => new Promise((res, rej) => {
      const t = d.transaction(STORE, mode);
      const out = fn(t.objectStore(STORE));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    }));
  }
  function idbPut(rec){
    if (useMem){ memQueue.set(rec.qid, rec); return Promise.resolve(); }
    return tx('readwrite', st => st.put(rec)).catch(() => { memQueue.set(rec.qid, rec); });
  }
  function idbDelete(qid){
    if (useMem){ memQueue.delete(qid); return Promise.resolve(); }
    return tx('readwrite', st => st.delete(qid)).catch(() => { memQueue.delete(qid); });
  }
  function idbAll(){
    if (useMem) return Promise.resolve(Array.from(memQueue.values()));
    return db().then(d => new Promise((res, rej) => {
      const rq = d.transaction(STORE, 'readonly').objectStore(STORE).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error);
    })).catch(() => Array.from(memQueue.values()));
  }

  /* ---- helpers ---- */
  function subscribe(fn){
    subs.push(fn);
    return () => { const i = subs.indexOf(fn); if (i !== -1) subs.splice(i, 1); };
  }
  function notify(taskId){ subs.forEach(fn => { try{ fn(taskId); }catch(e){ console.error(e); } }); }

  function kindOf(mime, name){
    mime = String(mime || '');
    if (mime.indexOf('image/') === 0) return 'image';
    if (mime === 'application/pdf' || /\.pdf$/i.test(name || '')) return 'pdf';
    return 'other';
  }
  function extFor(mime){
    if (mime === 'image/png') return '.png';
    if (mime === 'image/jpeg') return '.jpg';
    if (mime === 'image/webp') return '.webp';
    if (mime === 'image/gif') return '.gif';
    return '';
  }
  function fileToB64(f){
    return new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => res(String(rd.result).split(',')[1] || '');
      rd.onerror = () => rej(rd.error);
      rd.readAsDataURL(f);
    });
  }
  async function queueBytes(){
    const items = await idbAll();
    return items.reduce((n, it) => n + (it.size || 0), 0);
  }

  /* ---- add files (picker / camera / paste) ---- */
  async function addFiles(taskId, fileList, nameHint){
    const files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    if (!Sync.enabled()){
      Toast.show('Set up Sheet sync first - attachments upload to Drive through the Apps Script.', { kind:'error', duration:6000 });
      return;
    }
    let queued = 0;
    for (let i = 0; i < files.length; i++){
      const f = files[i];
      if (f.size > MAX_FILE){
        Toast.show('"' + (f.name || 'file') + '" is over the 10MB limit.', { kind:'error', duration:5000 });
        continue;
      }
      const total = await queueBytes();
      if (total + f.size > MAX_QUEUE){
        Toast.show('Offline upload queue is full - get online and sync first.', { kind:'error', duration:5000 });
        break;
      }
      const name = f.name || ((nameHint || 'capture') + '-' + Date.now() + extFor(f.type));
      let b64;
      try{ b64 = await fileToB64(f); }
      catch(e){ Toast.show('Could not read "' + name + '".', { kind:'error' }); continue; }
      const att = {
        id: uid('att'), name: name, type: kindOf(f.type, name),
        driveUrl: null, thumbUrl: null,
        uploadedBy: Store.identity() || '?', uploadedAt: nowISO(),
        pending: true
      };
      Tasks.addAttachment(taskId, att);
      await idbPut({ qid: att.id, taskId: taskId, name: name,
                     mimeType: f.type || 'application/octet-stream',
                     data: b64, size: f.size, addedAt: nowISO() });
      queued++;
      notify(taskId);
    }
    if (queued){
      Toast.show(navigator.onLine ? 'Uploading ' + queued + ' file' + (queued > 1 ? 's' : '') + '…'
                                  : 'Queued - will upload when back online.');
      processQueue();
    }
  }

  /* ---- upload the queue, oldest first ---- */
  async function processQueue(){
    if (processing) return;
    if (!navigator.onLine || !Sync.enabled()) return;
    processing = true;
    try{
      const items = (await idbAll()).sort((a, b) => String(a.addedAt).localeCompare(String(b.addedAt)));
      for (let i = 0; i < items.length; i++){
        const it = items[i];
        const t = Store.getTask(it.taskId);
        const a = t && (t.attachments || []).find(x => x.id === it.qid);
        if (!t || t.deleted || !a){          /* task or attachment gone - drop silently */
          await idbDelete(it.qid);
          continue;
        }
        try{
          const res = await Sync.call({ action:'uploadFile', name: it.name, mimeType: it.mimeType, data: it.data });
          Tasks.finishAttachment(it.taskId, it.qid, res.driveUrl, res.thumbUrl || null);
          await idbDelete(it.qid);
          notify(it.taskId);
        }catch(err){
          console.warn('[TaskHub] upload failed, will retry:', err);
          Toast.show('Upload failed: ' + String(err && err.message || err), { kind:'error', duration:5000, actionLabel:'Retry', action: () => processQueue() });
          break;                             /* stop; retry on next tick / online */
        }
      }
    } finally {
      processing = false;
    }
  }

  function remove(taskId, attId){
    Tasks.removeAttachment(taskId, attId);
    idbDelete(attId);
    notify(taskId);
    Toast.show('Attachment removed - the file itself stays in Drive.');
  }

  async function pendingTotal(){ return (await idbAll()).length; }

  function init(){
    window.addEventListener('online', () => processQueue());
    setInterval(() => { processQueue(); }, 45000);
    setTimeout(() => processQueue(), 1500);   /* resume queue from a previous session */
  }

  return { init:init, addFiles:addFiles, remove:remove, processQueue:processQueue,
           subscribe:subscribe, pendingTotal:pendingTotal, _kindOf:kindOf };
})();

/* ------------------------------------------------------------
   P6. NOTIFICATIONS - due reminders, nag mode, partner alerts,
       morning digest (in-app, always on)
   Permission is requested ONLY when a notification setting is
   first enabled - never on load.
   ------------------------------------------------------------ */
const Notify = (function(){

  function supported(){ return 'Notification' in window; }
  function granted(){ return supported() && Notification.permission === 'granted'; }
  function masterOn(){ return !!Store.get('notifMaster'); }

  async function ensurePermission(){
    if (!supported()){
      Toast.show('This browser does not support notifications.', { kind:'error' });
      return false;
    }
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied'){
      Toast.show('Notifications are blocked for this site - allow them in browser settings.', { kind:'error', duration:6000 });
      return false;
    }
    try{
      const p = await Notification.requestPermission();
      if (p !== 'granted') Toast.show('Notifications stay silent until permission is granted.');
      return p === 'granted';
    }catch(e){ return false; }
  }

  function fire(title, body, tag){
    if (!masterOn() || !granted()) return false;
    try{
      const n = new Notification(title, { body: body || '', tag: tag || undefined });
      n.onclick = function(){ try{ window.focus(); }catch(e){} try{ n.close(); }catch(e){} };
      return true;
    }catch(e){
      console.warn('[TaskHub] notification failed', e);
      return false;
    }
  }

  /* ---- due-today reminder: once per IST day at dailyReminderTime ---- */
  function dueReminderCheck(){
    if (!masterOn() || !Store.get('notifDue') || !granted()) return;
    const tk = todayKey();
    if (Store.metaGet('lastDueNotifyDate') === tk) return;
    const at = String(Store.get('dailyReminderTime') || '09:00');
    const nowIST = istShift();
    const hm = pad2(nowIST.getUTCHours()) + ':' + pad2(nowIST.getUTCMinutes());
    if (hm < at) return;                          /* reminder time not reached yet */
    Store.metaSet('lastDueNotifyDate', tk);       /* one shot per day, even if empty */
    const due = Tasks.open().filter(Tasks.isDueToday);
    const over = Tasks.open().filter(Tasks.isOverdue).length;
    if (!due.length && !over) return;
    const names = due.slice(0, 3).map(t => t.title).join(' · ');
    const more = due.length > 3 ? ' +' + (due.length - 3) + ' more' : '';
    const body = (due.length ? 'Due today: ' + names + more : '')
               + (over ? ((due.length ? '\n' : '') + over + ' overdue') : '');
    fire('TaskHub - ' + (due.length ? due.length + ' due today' : over + ' overdue'),
         body, 'taskhub-due-' + tk);
  }

  /* ---- nag mode: overdue re-notify every N hours while open ---- */
  function nagCheck(){
    if (!masterOn() || !Store.get('nagMode') || !granted()) return;
    const over = Tasks.open().filter(Tasks.isOverdue);
    if (!over.length) return;
    const hours = clamp(+Store.get('nagInterval') || 4, 1, 24);
    const last = Store.metaGet('lastNagAt');
    if (last && (Date.now() - new Date(last).getTime()) < hours * 3600000) return;
    Store.metaSet('lastNagAt', nowISO());
    const names = over.slice(0, 3).map(t => t.title + ' (' + Tasks.daysLate(t) + 'd late)').join(' · ');
    fire('TaskHub - ' + over.length + ' overdue',
         names + (over.length > 3 ? ' +' + (over.length - 3) + ' more' : ''), 'taskhub-nag');
  }

  /* ---- new-task-from-partner (called by Sync.pull) ---- */
  function onPartnerTasks(list){
    if (!masterOn() || !Store.get('notifBossTask') || !granted()) return;
    const who = displayName('partner');
    if (list.length <= 3){
      list.forEach(t => fire(who + ' added: ' + t.title,
        t.dueDate ? 'Due ' + fmtDate(t.dueDate) : 'No due date', 'taskhub-new-' + t.id));
    } else {
      fire(who + ' added ' + list.length + ' tasks',
        list.slice(0, 3).map(t => t.title).join(' · ') + ' +' + (list.length - 3) + ' more',
        'taskhub-new-multi');
    }
  }

  /* ---- morning digest: in-app modal, first open of each IST day ---- */
  function maybeDigest(force){
    const tk = todayKey();
    if (!force){
      if (Store.metaGet('lastDigestDate') === tk) return false;
      if (Modal.anyOpen()) return false;          /* wizard/lock first - retry on next visible */
    }
    const open = Tasks.open();
    const overdue = open.filter(Tasks.isOverdue).length;
    const dueToday = open.filter(Tasks.isDueToday).length;
    const inprog = open.filter(t => t.status === 'inprogress').length;
    if (!force && !overdue && !dueToday && !inprog){
      Store.metaSet('lastDigestDate', tk);        /* nothing to report today */
      return false;
    }
    Store.metaSet('lastDigestDate', tk);

    const body = el('div');
    body.appendChild(el('p', { class:'wiz-p', text:'Here is where the day stands:' }));
    const grid = el('div', { class:'dg-grid' });
    const cell = (n, label, cls) => el('div', { class:'dg-cell' + (cls ? ' ' + cls : '') }, [
      el('div', { class:'dg-num', text:String(n) }),
      el('div', { class:'dg-label', text:label })
    ]);
    grid.appendChild(cell(overdue, 'overdue', overdue ? 'is-over' : ''));
    grid.appendChild(cell(dueToday, 'due today', dueToday ? 'is-due' : ''));
    grid.appendChild(cell(inprog, 'in progress', ''));
    body.appendChild(grid);

    const foot = el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap', width:'100%' } });
    if (overdue) foot.appendChild(el('button', { class:'btn btn-danger btn-sm', text:'View overdue',
      onclick: () => { Modal.close(inst); AllState.chips = { overdue:true }; Router.go('all'); } }));
    if (dueToday) foot.appendChild(el('button', { class:'btn btn-sm', text:'Due today',
      onclick: () => { Modal.close(inst); Router.go('today'); } }));
    if (inprog) foot.appendChild(el('button', { class:'btn btn-sm', text:'In progress',
      onclick: () => { Modal.close(inst); AllState.chips = {}; AllState.fStatus = 'inprogress'; Router.go('all'); } }));
    foot.appendChild(el('span', { style:{ flex:'1' } }));
    foot.appendChild(el('button', { class:'btn btn-primary btn-sm', text:'Let’s go', onclick: () => Modal.close(inst) }));

    const inst = Modal.open({ title:'Good morning - ' + fmtDate(tk), body:body, footer:foot });
    return true;
  }

  function tick(){
    dueReminderCheck();
    nagCheck();
  }

  /* ---- settings panel ---- */
  function settingsPanel(){
    const pm = el('div', { class:'panel', style:{ marginBottom:'16px' } });
    pm.appendChild(el('div', { class:'side-group-label', style:{ padding:'0 0 10px' }, text:'Notifications' }));

    pm.appendChild(switchRow('Enable notifications',
      supported() ? 'Browser notifications while TaskHub is open' : 'Not supported in this browser',
      Store.get('notifMaster'), async v => {
        Store.set('notifMaster', v);
        if (v) await ensurePermission();
        Router.render();
      }));

    if (Store.get('notifMaster')){
      pm.appendChild(switchRow('Due-today reminder', 'One notification at the daily reminder time',
        Store.get('notifDue'), async v => { Store.set('notifDue', v); if (v) await ensurePermission(); }));

      const trow = el('div', { class:'row-line' });
      trow.appendChild(el('div', { class:'rl-main' }, [
        el('div', { class:'rl-title', text:'Daily reminder time' }),
        el('div', { class:'rl-desc', text:'IST · date-only tasks notify at this time' })
      ]));
      const tinp = el('input', { class:'inp', type:'time', style:{ maxWidth:'130px', minHeight:'36px' }, 'aria-label':'Daily reminder time' });
      tinp.value = Store.get('dailyReminderTime') || '09:00';
      tinp.addEventListener('change', () => {
        Store.set('dailyReminderTime', tinp.value || '09:00');
        Store.metaSet('lastDueNotifyDate', null);      /* allow a re-fire at the new time */
      });
      trow.appendChild(tinp);
      pm.appendChild(trow);

      pm.appendChild(switchRow('Nag mode', 'Re-notify about overdue tasks while the tool is open',
        Store.get('nagMode'), async v => {
          Store.set('nagMode', v);
          if (v){ Store.metaSet('lastNagAt', nowISO()); await ensurePermission(); }
          Router.render();
        }));
      if (Store.get('nagMode')){
        pm.appendChild(segRow('Nag every', '', [
          { id:'2', label:'2h' }, { id:'4', label:'4h' }, { id:'8', label:'8h' }
        ], String(Store.get('nagInterval') || 4), v => Store.set('nagInterval', +v)));
      }

      pm.appendChild(switchRow('New tasks from ' + displayName('partner'),
        'Notify when a sync pull finds a task they created',
        Store.get('notifBossTask'), async v => { Store.set('notifBossTask', v); if (v) await ensurePermission(); }));

      const test = el('div', { class:'row-line' });
      test.appendChild(el('div', { class:'rl-main' }, [ el('div', { class:'rl-title', text:'Test' }) ]));
      test.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'Send test notification', onclick: async () => {
        if (!(await ensurePermission())) return;
        const ok = fire('TaskHub', 'Notifications are working. ' + APP.tagline, 'taskhub-test');
        if (!ok) Toast.show('Could not fire - check the master toggle and permission.', { kind:'error' });
      } }));
      pm.appendChild(test);
    }
    return pm;
  }

  function init(){
    setInterval(tick, 30000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden){ tick(); maybeDigest(false); }
    });
  }

  return { init:init, tick:tick, fire:fire, ensurePermission:ensurePermission,
           onPartnerTasks:onPartnerTasks, maybeDigest:maybeDigest,
           settingsPanel:settingsPanel, granted:granted, supported:supported };
})();

/* ------------------------------------------------------------
   P2g. CATEGORY MANAGEMENT (Settings panel)
   ------------------------------------------------------------ */
const CatUI = (function(){
  const TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

  function commit(){ Store.setCats(Store.cats().slice()); }

  function panel(){
    const p = el('div', { class:'panel', style:{ marginBottom:'16px' } });
    p.appendChild(el('div', { class:'side-group-label', style:{ padding:'0 0 10px' }, text:'Categories' }));

    Store.cats().forEach(c => {
      const row = el('div', { class:'catrow' });
      const col = el('input', { type:'color', 'aria-label':'Color for ' + c.name });
      col.value = c.color;
      col.addEventListener('change', () => { c.color = col.value; commit(); });
      row.appendChild(col);

      const name = el('input', { class:'inp', maxlength:'30', 'aria-label':'Category name' });
      name.value = c.name;
      name.addEventListener('change', () => {
        const v = name.value.trim();
        if (!v){ name.value = c.name; return; }
        c.name = v; commit();
      });
      row.appendChild(name);

      if (c.personalOnly){
        row.appendChild(el('span', { class:'cat-lock', text:'🔒 never synced' }));
      } else if (c.id === 'cat_general'){
        row.appendChild(el('span', { class:'cat-lock', text:'fallback' }));
      } else {
        row.appendChild(el('button', {
          class:'icon-btn', 'aria-label':'Delete ' + c.name, html:TRASH,
          onclick: async () => {
            const ok = await Modal.confirm({
              title:'Delete "' + c.name + '"?',
              message:'Tasks in this category will move to General.',
              confirmLabel:'Delete', danger:true
            });
            if (!ok) return;
            const moved = Tasks.reassignCategory(c.id, Store.generalCatId());
            Store.setCats(Store.cats().filter(x => x.id !== c.id));
            if (AllState.fCat === c.id) AllState.fCat = '';
            if (DoneState.fCat === c.id) DoneState.fCat = '';
            if (Router.state.categoryFilter === c.id) Router.state.categoryFilter = null;
            Toast.show('Category deleted' + (moved ? ' · ' + moved + ' task(s) moved to General.' : '.'));
            Router.render();
          }
        }));
      }
      p.appendChild(row);
    });

    /* add new */
    const addRow = el('div', { class:'catrow' });
    const ncol = el('input', { type:'color', 'aria-label':'New category color' });
    ncol.value = '#7c4dff';
    const nname = el('input', { class:'inp', maxlength:'30', placeholder:'New category…', 'aria-label':'New category name' });
    const add = () => {
      const v = nname.value.trim();
      if (!v) return;
      if (Store.cats().some(c => c.name.toLowerCase() === v.toLowerCase())){
        Toast.show('Category already exists.', { kind:'error' });
        return;
      }
      const cats = Store.cats().slice();
      cats.push({ id:uid('cat'), name:v, color:ncol.value, personalOnly:false });
      Store.setCats(cats);
      Router.render();
      Toast.show('Category added.');
    };
    nname.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } });
    addRow.appendChild(ncol);
    addRow.appendChild(nname);
    addRow.appendChild(el('button', { class:'btn btn-sm', text:'Add', onclick:add }));
    p.appendChild(addRow);
    return p;
  }

  return { panel:panel };
})();

/* ------------------------------------------------------------
   P7a. STATS MINI-DASHBOARD
   ------------------------------------------------------------ */
Views.stats = function(mount){
  const view = el('div', { class:'view' });
  const tk = todayKey();
  const all = Tasks.all();
  const open = Tasks.open();

  const doneWithin = days => all.filter(t => {
    if (t.status !== 'done' || !t.completedAt) return false;
    const d = dayDiff(istDateKey(new Date(t.completedAt)), tk);
    return d >= 0 && d < days;
  });
  const doneWeek = doneWithin(7);
  const done30 = doneWithin(30);
  const overdue = open.filter(Tasks.isOverdue).length;
  const fromPartner = open.filter(Tasks.fromOther).length;
  let avg = null;
  if (done30.length){
    const ms = done30.reduce((n, t) => n + Math.max(0, new Date(t.completedAt) - new Date(t.createdAt)), 0) / done30.length;
    avg = Math.round(ms / 86400000 * 10) / 10;
  }

  const head = el('div', { class:'view-head' });
  head.appendChild(el('h1', { class:'view-title', text:'Stats' }));
  head.appendChild(el('span', { class:'view-sub', text:open.length + ' open · ' + all.length + ' total' }));
  head.appendChild(el('span', { style:{ flex:'1' } }));
  head.appendChild(el('button', { class:'btn btn-sm', text:'💬 WhatsApp summary', onclick: () => WhatsApp.open() }));
  view.appendChild(head);

  const grid = el('div', { class:'stat-grid' });
  const card = (num, label, warn) => el('div', { class:'stat-card' + (warn ? ' warn' : '') }, [
    el('div', { class:'stat-num', text:String(num) }),
    el('div', { class:'stat-label', text:label })
  ]);
  grid.appendChild(card(doneWeek.length, 'done this week'));
  grid.appendChild(card(overdue, 'overdue', overdue > 0));
  grid.appendChild(card(fromPartner, 'pending from ' + displayName('partner')));
  grid.appendChild(card(avg == null ? '-' : avg + 'd', 'avg completion · 30d'));
  view.appendChild(grid);

  /* 7-day done history - pure CSS bars */
  const panel = el('div', { class:'panel' });
  panel.appendChild(el('div', { class:'side-group-label', style:{ padding:'0 0 6px' }, text:'Done - last 7 days' }));
  const counts = [];
  for (let i = 6; i >= 0; i--){
    const k = addDaysKey(tk, -i);
    counts.push({ k:k, n: doneWeek.filter(t => istDateKey(new Date(t.completedAt)) === k).length });
  }
  const mx = Math.max(1, Math.max.apply(null, counts.map(c => c.n)));
  const chart = el('div', { class:'chart7' });
  counts.forEach(c => {
    const col = el('div', { class:'c7-col', title: fmtDate(c.k) + ' · ' + c.n + ' done' });
    col.appendChild(el('div', { class:'c7-n', text: c.n ? String(c.n) : '' }));
    const bar = el('div', { class:'c7-bar' });
    bar.style.height = Math.max(3, Math.round(c.n / mx * 100)) + '%';
    if (!c.n) bar.style.opacity = '.25';
    col.appendChild(bar);
    col.appendChild(el('div', { class:'c7-d', text: c.k === tk ? 'Today' : WEEKDAYS[weekdayOfKey(c.k)] }));
    chart.appendChild(col);
  });
  panel.appendChild(chart);
  view.appendChild(panel);
  mount.appendChild(view);
};

/* ------------------------------------------------------------
   P7b. WHATSAPP SUMMARY GENERATOR
   ------------------------------------------------------------ */
const WhatsApp = (function(){
  let mode = 'daily', incP = false;

  function build(m, includePersonal){
    const tk = todayKey();
    let pool = Tasks.all();
    if (!includePersonal) pool = pool.filter(t => !t.personal);
    const open = pool.filter(t => t.status !== 'done');
    const overdue = open.filter(Tasks.isOverdue);
    const inprog = open.filter(t => t.status === 'inprogress' && !Tasks.isOverdue(t));
    const pending = open.filter(t => (t.status === 'todo' || t.status === 'waiting') && !Tasks.isOverdue(t));

    const bullet = t => '• ' + t.title;
    const dueBullet = t => '• ' + t.title + (t.dueDate ? ' - due ' + fmtDateShort(t.dueDate) : '');
    const overBullet = t => '• ' + t.title + ' - due ' + fmtDateShort(t.dueDate) + ' (' + Tasks.daysLate(t) + 'd late)';

    let out = '';
    if (m === 'daily'){
      const doneToday = pool.filter(t => t.status === 'done' && t.completedAt && istDateKey(new Date(t.completedAt)) === tk);
      out += '📋 *Task Report - ' + fmtDate(tk) + '*\n\n';
      out += '✅ *Done Today (' + doneToday.length + ')*\n';
      doneToday.forEach(t => { out += bullet(t) + '\n'; });
      out += '\n🔄 *In Progress (' + inprog.length + ')*\n';
      inprog.forEach(t => { out += bullet(t) + '\n'; });
      out += '\n⏳ *Pending (' + pending.length + ')*\n';
      pending.forEach(t => { out += dueBullet(t) + '\n'; });
      out += '\n🔴 *Overdue (' + overdue.length + ')*\n';
      overdue.forEach(t => { out += overBullet(t) + '\n'; });
    } else {
      const inWeek = iso => { const d = dayDiff(istDateKey(new Date(iso)), tk); return d >= 0 && d < 7; };
      const doneWeek = pool.filter(t => t.status === 'done' && t.completedAt && inWeek(t.completedAt));
      const added = pool.filter(t => t.createdAt && inWeek(t.createdAt)).length;
      out += '📋 *Task Report - Week ' + fmtDate(addDaysKey(tk, -6)) + ' → ' + fmtDate(tk) + '*\n\n';
      out += '✅ *Done This Week (' + doneWeek.length + ')*\n';
      const g = {};
      doneWeek.forEach(t => { const k = istDateKey(new Date(t.completedAt)); (g[k] = g[k] || []).push(t); });
      Object.keys(g).sort().reverse().forEach(k => {
        out += '_' + WEEKDAYS[weekdayOfKey(k)] + ' ' + fmtDateShort(k) + '_\n';
        g[k].forEach(t => { out += bullet(t) + '\n'; });
      });
      out += '\n🔄 *In Progress (' + inprog.length + ')*\n';
      inprog.forEach(t => { out += bullet(t) + '\n'; });
      out += '\n⏳ *Pending (' + pending.length + ')*\n';
      pending.forEach(t => { out += dueBullet(t) + '\n'; });
      out += '\n🔴 *Overdue (' + overdue.length + ')*\n';
      overdue.forEach(t => { out += overBullet(t) + '\n'; });
      out += '\nDone ' + doneWeek.length + ' | Added ' + added + ' | Overdue ' + overdue.length;
    }
    return out.trim() + '\n';
  }

  function open(){
    const body = el('div');
    body.appendChild(segPick([{ id:'daily', label:'Daily' }, { id:'weekly', label:'Weekly' }], mode, v => { mode = v; refresh(); }));
    body.appendChild(switchRow('Include personal tasks', 'Off - personal stays out of the report',
      incP, v => { incP = v; refresh(); }));
    const ta = el('textarea', { class:'txt wa-out', readonly:true, 'aria-label':'Report text' });
    body.appendChild(ta);
    function refresh(){
      ta.value = build(mode, incP);
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight + 4, 360) + 'px';
    }
    refresh();
    const foot = el('div', { style:{ display:'flex', gap:'8px' } });
    foot.appendChild(el('button', { class:'btn btn-outline', text:'Close', onclick: () => Modal.close(inst) }));
    foot.appendChild(el('button', { class:'btn btn-primary', text:'Copy to clipboard',
      onclick: () => copyText(ta.value, 'Report copied - paste it into WhatsApp.') }));
    const inst = Modal.open({ title:'WhatsApp summary', body:body, footer:foot });
  }

  return { open:open, build:build };
})();

/* ------------------------------------------------------------
   P7c. PASTE IMPORT - bulk tasks from a pasted Word-doc block
   ------------------------------------------------------------ */
const PasteImport = (function(){
  function cleanLine(sIn){
    return sIn.replace(/^\s*(?:[-*•●▪▸>]+|\d+[.)])\s*/, '').trim();
  }

  function open(){
    const body = el('div');
    body.appendChild(el('p', { class:'wiz-p', text:'Paste a block of text - every non-empty line becomes a task. Bullets and numbering are stripped.' }));
    const ta = el('textarea', { class:'txt', placeholder:'One task per line…', 'data-autofocus':'1', style:{ minHeight:'120px' } });
    body.appendChild(ta);

    const grid = el('div', { class:'dt-grid', style:{ marginTop:'12px' } });
    const pri = miniSel('Priority for all',
      [['', 'Default (' + (Store.get('defaultPriority') || 'medium') + ')']].concat(PRIORITIES.map(p => [p.id, p.label])), '', () => {});
    const cat = catSelect(Store.generalCatId(), null);
    const due = el('input', { class:'inp', type:'date', 'aria-label':'Due date for all' });
    const asg = miniSel('Assigned by for all', IDENTITIES.map(n => [n, displayName(n)]), Store.identity() || 'Manan', () => {});
    grid.appendChild(fieldWrap('Priority (all)', pri));
    grid.appendChild(fieldWrap('Category (all)', cat));
    grid.appendChild(fieldWrap('Due date (all)', due));
    grid.appendChild(fieldWrap('Assigned by (all)', asg));
    body.appendChild(grid);

    body.appendChild(el('div', { class:'dt-label', text:'Preview' }));
    const prev = el('div', { class:'pi-prev' });
    body.appendChild(prev);

    const lines = () => ta.value.split(/\r?\n/).map(cleanLine).filter(Boolean);
    const go = el('button', { class:'btn btn-primary', text:'Create 0 tasks', onclick: () => {
      const ls = lines();
      if (!ls.length) return;
      const ids = [];
      ls.forEach(l => {
        const fields = { title:l, category:cat.value, dueDate:due.value || null, assignedBy:asg.value };
        if (pri.value) fields.priority = pri.value;
        const t = Tasks.create(fields);
        if (t) ids.push(t.id);
      });
      Modal.close(inst);
      Toast.show('Imported ' + ids.length + ' task' + (ids.length === 1 ? '' : 's') + '.', {
        actionLabel:'Undo', duration:5000,
        action: () => { ids.forEach(idv => Tasks.retractSpawn(idv)); Toast.show('Import undone.'); }
      });
      Router.go('all');
    } });
    function refresh(){
      const ls = lines();
      prev.innerHTML = '';
      ls.slice(0, 50).forEach((l, i) => prev.appendChild(el('div', { class:'pi-row', text:(i + 1) + '. ' + l })));
      if (ls.length > 50) prev.appendChild(el('div', { class:'dt-none', text:'…and ' + (ls.length - 50) + ' more' }));
      if (!ls.length) prev.appendChild(el('div', { class:'dt-none', text:'Nothing yet.' }));
      go.textContent = 'Create ' + ls.length + ' task' + (ls.length === 1 ? '' : 's');
      go.disabled = !ls.length;
    }
    ta.addEventListener('input', debounce(refresh, 150));
    refresh();

    const foot = el('div', { style:{ display:'flex', gap:'8px' } });
    foot.appendChild(el('button', { class:'btn btn-outline', text:'Cancel', onclick: () => Modal.close(inst) }));
    foot.appendChild(go);
    const inst = Modal.open({ title:'Paste import', body:body, footer:foot, wide:true });
  }

  return { open:open, _cleanLine:cleanLine };
})();

/* ------------------------------------------------------------
   P7d. PRINT VIEW - clean sheet, grouped by status
   ------------------------------------------------------------ */
function printAllTasks(){
  const root = $('#printSheet');
  root.innerHTML = '';
  const tk = todayKey();
  root.appendChild(el('div', { class:'pr-head' }, [
    el('h1', { text:'TaskHub - All Tasks' }),
    el('div', { text: fmtDate(tk) + ' · ' + Tasks.open().length + ' open · printed by ' + displayName(Store.identity()) })
  ]));
  STATUSES.forEach(st => {
    const g = Tasks.all().filter(t => t.status === st.id && !Tasks.isArchived(t)).sort(Tasks.cmp('due'));
    if (!g.length) return;
    root.appendChild(el('h2', { text: st.label + ' (' + g.length + ')' }));
    g.forEach(t => {
      const row = el('div', { class:'pr-row' });
      row.appendChild(el('div', { class:'pr-title', text:(t.pinned ? '★ ' : '') + t.title }));
      const meta = [];
      meta.push((PRIORITIES.find(p => p.id === t.priority) || { label:'?' }).label);
      meta.push(Store.catName(t.category));
      if (t.dueDate) meta.push('due ' + fmtDate(t.dueDate));
      if (Tasks.isOverdue(t)) meta.push(Tasks.daysLate(t) + 'd late');
      if (Tasks.fromOther(t)) meta.push('from ' + displayName(t.assignedBy));
      if (t.subtasks && t.subtasks.length) meta.push(t.subtasks.filter(x => x.done).length + '/' + t.subtasks.length + ' subtasks');
      row.appendChild(el('div', { class:'pr-meta', text:meta.join(' · ') }));
      if (t.notes) row.appendChild(el('div', { class:'pr-notes', text:t.notes }));
      root.appendChild(row);
    });
  });
  window.print();
}

/* ------------------------------------------------------------
   P7e. KEYBOARD SHORTCUTS HELP
   ------------------------------------------------------------ */
function openShortcutsHelp(){
  const rows = [['N', 'New task'], ['/', 'Focus search'], ['D', 'Mark focused task done'], ['Esc', 'Close dialog'], ['?', 'This help']];
  const body = el('div');
  rows.forEach(r => body.appendChild(el('div', { class:'row-line' }, [
    el('span', { class:'kbd', text:r[0] }),
    el('div', { class:'rl-main', style:{ marginLeft:'10px' } }, [ el('div', { class:'rl-title', text:r[1] }) ])
  ])));
  body.appendChild(el('p', { class:'wiz-p', style:{ marginTop:'10px' }, text:'Shortcuts work outside text fields.' }));
  Modal.open({ title:'Keyboard shortcuts', body:body });
}

/* ------------------------------------------------------------
   P7f. DATA SETTINGS - export / import / clear
   ------------------------------------------------------------ */
function exportJSON(){
  const settings = clone(Store.settings());
  delete settings.lockHash;         /* per-device security never leaves the device */
  delete settings.autoLockMin;
  const data = {
    app:'TaskHub', version:APP.version, exportedAt:nowISO(), identity:Store.identity(),
    tasks:Store.tasks(), categories:Store.cats(), settings:settings,
    meta:{ partnerNameAt: Store.metaGet('partnerNameAt') }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = el('a', { href:URL.createObjectURL(blob), download:'taskhub-export-' + todayKey() + '.json' });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  Toast.show('Exported ' + Store.tasks().length + ' tasks.');
}

async function importJSON(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ Toast.show('That file is not valid JSON.', { kind:'error' }); return; }
  const tasks = Array.isArray(data.tasks) ? data.tasks : [];
  const cats = Array.isArray(data.categories) ? data.categories : [];
  if (!tasks.length && !cats.length){
    Toast.show('No tasks or categories found in that file.', { kind:'error' });
    return;
  }
  const ok = await Modal.confirm({
    title:'Import data?',
    message:'Merge ' + tasks.length + ' tasks and ' + cats.length + ' categories into this device. Per task the newer updatedAt wins; nothing is deleted.',
    confirmLabel:'Merge'
  });
  if (!ok) return;

  const who = w => (w === 'Boss' ? 'partner' : w);   /* legacy exports */
  const q = Store.metaGet('pendingSync');
  const enqueue = t => { if (!t.personal && q.indexOf(t.id) === -1) q.push(t.id); };
  let added = 0, updated = 0;
  tasks.forEach(rt => {
    if (!rt || !rt.id || typeof rt.id !== 'string') return;
    rt.title = String(rt.title || '');
    if (['todo','inprogress','waiting','done'].indexOf(rt.status) === -1) rt.status = 'todo';
    if (['high','medium','low'].indexOf(rt.priority) === -1) rt.priority = 'medium';
    ['subtasks','links','attachments','comments','activity'].forEach(k => {
      if (!Array.isArray(rt[k])) rt[k] = [];
    });
    rt.pinned = !!rt.pinned;
    rt.personal = !!rt.personal;
    rt.deleted = !!rt.deleted;
    if (!rt.updatedAt) rt.updatedAt = rt.createdAt || nowISO();
    if (!rt.createdAt) rt.createdAt = rt.updatedAt;
    rt.assignedBy = who(rt.assignedBy);
    rt.createdBy = who(rt.createdBy);
    (rt.comments || []).forEach(c => { c.author = who(c.author); });
    (rt.activity || []).forEach(a => { a.who = who(a.who); });
    const local = Store.getTask(rt.id);
    if (!local){
      Store.tasks().push(rt);
      enqueue(rt);
      added++;
    } else if (String(rt.updatedAt || '') > String(local.updatedAt || '')){
      Store.tasks()[Store.tasks().indexOf(local)] = rt;
      enqueue(rt);
      updated++;
    }
  });
  const myCats = Store.cats();
  let catsAdded = 0;
  cats.forEach(c => {
    if (c && c.id && c.name && !myCats.some(x => x.id === c.id)){
      myCats.push({ id:c.id, name:String(c.name), color:c.color || '#8b98a5', personalOnly:!!c.personalOnly });
      catsAdded++;
    }
  });
  Store.saveMeta();
  Store.setCats(myCats.slice());
  Store.saveTasks();
  Store.emit('tasks');
  Toast.show('Imported: ' + added + ' new, ' + updated + ' updated' + (catsAdded ? ', ' + catsAdded + ' categories' : '') + '.');
}

async function clearLocalData(){
  const a = await Modal.confirm({
    title:'Clear local data?',
    message:'Deletes ALL tasks, categories and settings on THIS device. The Google Sheet is not touched.',
    confirmLabel:'Continue', danger:true
  });
  if (!a) return;
  const b = await Modal.confirm({
    title:'Really clear everything?',
    message:'Last chance - this cannot be undone on this device.',
    confirmLabel:'Clear everything', danger:true
  });
  if (!b) return;
  Store.clearAll();
  try{ indexedDB.deleteDatabase('taskhub-files'); }catch(e){}
  location.reload();
}

function settingsDataPanel(){
  const pm = el('div', { class:'panel', style:{ marginBottom:'16px' } });
  pm.appendChild(el('div', { class:'side-group-label', style:{ padding:'0 0 10px' }, text:'Data' }));

  const erow = el('div', { class:'row-line' });
  erow.appendChild(el('div', { class:'rl-main' }, [
    el('div', { class:'rl-title', text:'Export JSON' }),
    el('div', { class:'rl-desc', text:'Full local data - tasks, categories, settings (minus device security)' })
  ]));
  erow.appendChild(el('button', { class:'btn btn-sm', text:'Export', onclick:exportJSON }));
  pm.appendChild(erow);

  const irow = el('div', { class:'row-line' });
  irow.appendChild(el('div', { class:'rl-main' }, [
    el('div', { class:'rl-title', text:'Import JSON' }),
    el('div', { class:'rl-desc', text:'Merge by id - newer updatedAt wins' })
  ]));
  const finp = el('input', { type:'file', class:'hidden' });
  finp.setAttribute('accept', '.json,application/json');
  finp.addEventListener('change', () => { if (finp.files[0]) importJSON(finp.files[0]); finp.value = ''; });
  irow.appendChild(finp);
  irow.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'Import', onclick: () => finp.click() }));
  pm.appendChild(irow);

  const crow = el('div', { class:'row-line' });
  crow.appendChild(el('div', { class:'rl-main' }, [
    el('div', { class:'rl-title', text:'Clear local data' }),
    el('div', { class:'rl-desc', text:'Double-confirm wipe of this device only' })
  ]));
  crow.appendChild(el('button', { class:'btn btn-danger btn-sm', text:'Clear', onclick:clearLocalData }));
  pm.appendChild(crow);

  return pm;
}

/* ------------------------------------------------------------
   P8. PWA - manifest (data URI), generated icons, install prompt.
   The service worker is attempted from an inline blob per spec;
   browsers that reject blob workers lose nothing: the app is
   offline-first through localStorage either way.
   ------------------------------------------------------------ */
const PWA = (function(){
  let deferredPrompt = null;

  function makeIcon(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const r = size * 0.22;
    x.beginPath();
    x.moveTo(r, 0);
    x.arcTo(size, 0, size, size, r);
    x.arcTo(size, size, 0, size, r);
    x.arcTo(0, size, 0, 0, r);
    x.arcTo(0, 0, size, 0, r);
    x.closePath();
    const g = x.createLinearGradient(0, 0, 0, size);
    g.addColorStop(0, '#ffc85e');
    g.addColorStop(1, '#f59f00');
    x.fillStyle = g;
    x.fill();
    /* circle-check mark (matches the PNG icons) */
    const D = Math.PI / 180;
    x.strokeStyle = '#231700';
    x.lineCap = 'round';
    x.lineJoin = 'round';
    x.lineWidth = size * 0.095;
    x.beginPath();
    x.arc(size / 2, size / 2, size * 0.2675, 347 * D, (283 + 360) * D);
    x.stroke();
    x.lineWidth = size * 0.115;
    x.beginPath();
    x.moveTo(size * 0.33, size * 0.50);
    x.lineTo(size * 0.475, size * 0.64);
    x.lineTo(size * 0.78, size * 0.28);
    x.stroke();
    return c.toDataURL('image/png');
  }

  function injectManifest(external){
    try{
      const man = {
        name: 'TaskHub',
        short_name: 'TaskHub',
        description: 'Shared task manager - offline-first, synced via Google Sheets',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        background_color: '#f4f6f8',
        theme_color: '#ffb020',
        icons: [
          { src: makeIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: makeIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      let link = document.getElementById('manifestLink');
      if (!link){
        link = el('link', { id:'manifestLink', rel:'manifest' });
        document.head.appendChild(link);
      }
      if (!external){
        link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man));
      }
      const apple = el('link', { rel: 'apple-touch-icon' });
      apple.href = external ? 'icon-192.png' : makeIcon(180);
      document.head.appendChild(apple);
      const fav = el('link', { rel: 'icon', type: 'image/png' });
      fav.href = external ? 'icon-192.png' : makeIcon(64);
      document.head.appendChild(fav);
    }catch(e){ console.warn('[TaskHub] manifest injection failed', e); }
  }

  function tryServiceWorker(external){
    if (!('serviceWorker' in navigator)) return;
    if (external){
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.info('[TaskHub] service worker registered (sw.js)'))
        .catch(e => console.warn('[TaskHub] sw.js registration failed:', e));
      return;
    }
    try{
      const src =
        'self.addEventListener("install",function(e){self.skipWaiting()});' +
        'self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});' +
        'self.addEventListener("fetch",function(e){e.respondWith(' +
        'caches.open("taskhub-v1").then(function(c){return fetch(e.request).then(function(r){' +
        'try{c.put(e.request,r.clone())}catch(_){ }return r}).catch(function(){' +
        'return c.match(e.request,{ignoreSearch:true})})}))});';
      const blobUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      navigator.serviceWorker.register(blobUrl)
        .then(() => console.info('[TaskHub] service worker registered'))
        .catch(() => { /* blob workers are rejected by most browsers - expected */ });
    }catch(e){ /* offline still works via localStorage */ }
  }

  function init(){
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
    });
    setup();
  }

  /* Prefer the real PWA files (manifest.webmanifest + sw.js + PNG icons)
     when they sit next to this HTML file on a server; fall back to the
     inline data-URI manifest + canvas icons when the HTML travels alone. */
  async function setup(){
    let external = false;
    if (location.protocol === 'https:' || location.protocol === 'http:'){
      try{
        const res = await fetch('manifest.webmanifest', { cache:'no-cache' });
        external = !!(res && res.ok);
      }catch(e){ external = false; }
    }
    injectManifest(external);
    tryServiceWorker(external);
  }

  function canInstall(){ return !!deferredPrompt; }

  async function install(){
    if (!deferredPrompt){
      Toast.show('Use the browser menu: "Install app" / "Add to Home Screen".', { duration: 5000 });
      return;
    }
    deferredPrompt.prompt();
    try{
      const res = await deferredPrompt.userChoice;
      if (res && res.outcome === 'accepted') Toast.show('Installed - launch it from your home screen.');
    }catch(e){}
    deferredPrompt = null;
  }

  return { init: init, canInstall: canInstall, install: install };
})();

/* ------------------------------------------------------------
   12. GLOBAL KEY HANDLING (Esc closes modals - full set in Phase 7)
   ------------------------------------------------------------ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (Modal.anyOpen()){ e.preventDefault(); Modal.closeTop(); }
    return;
  }
  const tag = ((e.target && e.target.tagName) || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (Modal.anyOpen()) return;
  if (e.key === '/'){
    e.preventDefault();
    const si = $('#searchInput');
    if (si) si.focus();
  } else if (e.key === 'n' || e.key === 'N'){
    e.preventDefault();
    Shell.openQuickAdd();
  } else if (e.key === 'd' || e.key === 'D'){
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains('tcard')){
      const idv = a.getAttribute('data-id');
      if (idv){ e.preventDefault(); TaskUI.toggleDone(idv); }
    }
  } else if (e.key === '?'){
    e.preventDefault();
    openShortcutsHelp();
  }
});

/* ------------------------------------------------------------
   13. BOOT
   ------------------------------------------------------------ */
function boot(){
  Store.load();
  Tasks.init();
  Theme.init();
  Shell.init();
  refreshCounts();
  Sync.init();
  Attach.init();
  Notify.init();
  PWA.init();

  const start = () => {
    const dv = Store.get('defaultView') || 'today';
    Router.go(Views[dv] ? dv : 'today');
    /* first run and no sync configured → offer the wizard once */
    if (!Store.metaGet('setupDone') && !Store.get('scriptUrl')){
      Store.metaSet('setupDone', true);
      setTimeout(() => Sync.openWizard(), 500);
    }
    /* morning digest - first open of the IST day (defers politely if a modal is up) */
    setTimeout(() => Notify.maybeDigest(false), 900);
    setTimeout(() => Notify.tick(), 1500);
  };

  const enter = () => {
    if (Identity.needsPick()){
      Identity.show(() => { Shell.renderIdentityChip(); start(); });
    } else {
      $('#identityScreen').classList.add('hidden');
      $('#app').classList.remove('hidden');
      start();
    }
  };

  Lock.init();
  if (Lock.required()) Lock.show(enter);
  else enter();

  if (!Store.persistent()){
    Toast.show('Browser storage is blocked here - nothing will be saved.', { kind:'error', duration:7000 });
  }

  window.addEventListener('beforeunload', () => Store.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
