<!DOCTYPE html>
<html lang="en" data-theme="gold" data-mode="light" data-font="snpro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffb020">
<link id="manifestLink" rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskHub">
<meta name="description" content="TaskHub - shared task management. Built as a tool, used like a weapon.">
<title>TaskHub</title>
<style>
/* ============================================================
   TASKHUB v1.0  -  BUILT AS A TOOL, USED LIKE A WEAPON.
   Single file. Zero dependencies.
   [1] TOKENS & THEMES
   [2] BASE / RESET
   [3] LAYOUT SHELL
   [4] HEADER / SIDEBAR / BOTTOM NAV
   [5] COMPONENTS (buttons, chips, cards, forms)
   [6] OVERLAYS (identity, modal, sheet, toast)
   [7] RESPONSIVE
   ============================================================ */

/* ---------- [1] TOKENS & THEMES ---------- */
:root{
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --tap:44px;
  --sidebar-w:246px;
  --header-h:60px;
  --bnav-h:62px;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:23px; --fs-xxl:30px;
  --tr:160ms cubic-bezier(.4,0,.2,1);

  /* semantic fixed colors (theme independent) */
  --pri-high:#e5484d;
  --pri-medium:#f5a524;
  --pri-low:#3fa96a;
  --st-todo:#8b98a5;
  --st-inprogress:#2b7fd4;
  --st-waiting:#c07a12;
  --st-done:#3fa96a;
  --danger:#e5484d;
  --warn:#f5872b;
  --ok:#3fa96a;
}

/* --- LIGHT MODE BASE --- */
html[data-mode="light"]{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --surface-2:#eef1f5;
  --surface-3:#e4e9ef;
  --text:#151920;
  --text-dim:#5d6674;
  --text-faint:#8b94a3;
  --border:#e0e5ec;
  --border-strong:#cdd4de;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-2:0 4px 12px rgba(16,24,40,.10);
  --shadow-3:0 12px 40px rgba(16,24,40,.18);
  --overlay:rgba(18,22,29,.44);
  --scrim:rgba(255,255,255,.7);
}
/* --- DARK MODE BASE --- */
html[data-mode="dark"]{
  --bg:#0e1015;
  --surface:#161a21;
  --surface-2:#1e232c;
  --surface-3:#262c37;
  --text:#eef1f6;
  --text-dim:#9aa4b2;
  --text-faint:#6f7987;
  --border:#272d38;
  --border-strong:#39414f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 14px rgba(0,0,0,.5);
  --shadow-3:0 14px 44px rgba(0,0,0,.62);
  --overlay:rgba(0,0,0,.6);
  --scrim:rgba(14,16,21,.7);
  --pri-medium:#ffb84d;
  --st-waiting:#e0a13a;
}

/* --- ACCENT PALETTES (6 themes x 2 modes) --- */
html[data-theme="gold"][data-mode="light"]{ --accent:#ffb020; --accent-hi:#e79a09; --accent-soft:#fff3da; --accent-line:#ffd68a; --accent-ink:#231700; }
html[data-theme="gold"][data-mode="dark"]{  --accent:#ffb020; --accent-hi:#ffc451; --accent-soft:#3a2c0c; --accent-line:#5c4712; --accent-ink:#231700; }

html[data-theme="ocean"][data-mode="light"]{ --accent:#1f7ae0; --accent-hi:#1663b8; --accent-soft:#e4f0fd; --accent-line:#a9d0f7; --accent-ink:#ffffff; }
html[data-theme="ocean"][data-mode="dark"]{  --accent:#4d9dff; --accent-hi:#77b5ff; --accent-soft:#0f2740; --accent-line:#1c4570; --accent-ink:#04182c; }

html[data-theme="forest"][data-mode="light"]{ --accent:#1f9d55; --accent-hi:#177f44; --accent-soft:#e3f6ec; --accent-line:#a6e0c1; --accent-ink:#ffffff; }
html[data-theme="forest"][data-mode="dark"]{  --accent:#34c77b; --accent-hi:#5cd996; --accent-soft:#0f2d1e; --accent-line:#1c4d33; --accent-ink:#04200f; }

html[data-theme="purple"][data-mode="light"]{ --accent:#7c4dff; --accent-hi:#6335e6; --accent-soft:#eee8ff; --accent-line:#c9b4ff; --accent-ink:#ffffff; }
html[data-theme="purple"][data-mode="dark"]{  --accent:#a17cff; --accent-hi:#b89aff; --accent-soft:#241a40; --accent-line:#3d2d66; --accent-ink:#160a30; }

html[data-theme="rose"][data-mode="light"]{ --accent:#e0407a; --accent-hi:#c22c63; --accent-soft:#fde7ef; --accent-line:#f7b4cd; --accent-ink:#ffffff; }
html[data-theme="rose"][data-mode="dark"]{  --accent:#ff6f9c; --accent-hi:#ff92b5; --accent-soft:#3d1425; --accent-line:#63223c; --accent-ink:#2e0616; }

html[data-theme="slate"][data-mode="light"]{ --accent:#4a5766; --accent-hi:#36414d; --accent-soft:#e9edf1; --accent-line:#bcc6d1; --accent-ink:#ffffff; }
html[data-theme="slate"][data-mode="dark"]{  --accent:#93a1b0; --accent-hi:#b1bdc9; --accent-soft:#222833; --accent-line:#3a434f; --accent-ink:#10151c; }

/* --- FONT MODES --- */
html[data-font="snpro"] body{
  font-family:"SN Pro","SNPro","SN Pro Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-weight:900;
  letter-spacing:-.005em;
}
html[data-font="snpro"] input,
html[data-font="snpro"] textarea,
html[data-font="snpro"] select,
html[data-font="snpro"] button{ font-family:inherit; font-weight:900; }
html[data-font="calibri"] body{
  font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;
  font-weight:400;
  letter-spacing:0;
}
html[data-font="calibri"] input,
html[data-font="calibri"] textarea,
html[data-font="calibri"] select,
html[data-font="calibri"] button{ font-family:inherit; font-weight:400; }
html[data-font="calibri"] .th-strong,
html[data-font="calibri"] h1,html[data-font="calibri"] h2,html[data-font="calibri"] h3{ font-weight:700; }

/* ---------- [2] BASE / RESET ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs-md);
  line-height:1.42;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,p,ul,ol{ margin:0; }
ul,ol{ list-style:none; padding:0; }
button{ font-size:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; }
input,textarea,select{ font-size:inherit; color:inherit; }
a{ color:var(--accent-hi); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
::selection{ background:var(--accent); color:var(--accent-ink); }
.hidden{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar{ width:10px; height:10px; }
.scroll::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:99px; border:3px solid transparent; background-clip:content-box; }

/* ---------- [3] LAYOUT SHELL ---------- */
#app{
  min-height:100dvh;
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--header-h) 1fr;
  grid-template-areas:"brand header" "side main";
}
#brandBox{ grid-area:brand; }
#appHeader{ grid-area:header; }
.m-brand{ display:none; }
#sidebar{ grid-area:side; }
#mainWrap{ grid-area:main; min-width:0; display:flex; flex-direction:column; }
#main{ flex:1; min-height:0; padding:var(--sp-5); }
#appFooter{
  padding:var(--sp-4) var(--sp-5) var(--sp-5);
  color:var(--text-faint);
  font-size:var(--fs-xs);
  letter-spacing:.09em;
  display:flex; gap:var(--sp-3); align-items:center; justify-content:space-between; flex-wrap:wrap;
}
.view{ max-width:1080px; }
.view-head{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); flex-wrap:wrap; }
.view-title{ font-size:var(--fs-xl); letter-spacing:-.02em; }
.view-sub{ color:var(--text-dim); font-size:var(--fs-sm); }

/* ---------- [4] HEADER / SIDEBAR / BOTTOM NAV ---------- */
#brandBox{
  display:flex; align-items:center; gap:10px;
  padding:0 var(--sp-4);
  background:var(--surface);
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.brand-mark{ width:30px; height:30px; flex:none; display:block; }
.brand-mark svg{ width:100%; height:100%; display:block; }
.brand-name{ font-size:var(--fs-lg); letter-spacing:-.03em; }
.brand-col{ display:flex; flex-direction:column; min-width:0; line-height:1.3; }
.brand-desc{ font-size:9.5px; color:var(--text-faint); letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-ver{ font-size:9px; color:var(--text-faint); letter-spacing:.12em; margin-left:auto; }

#appHeader{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:0 var(--sp-5);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40;
}
.search-wrap{ position:relative; flex:2; max-width:560px; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-faint); pointer-events:none; }
#searchInput{
  width:100%; height:38px; padding:0 34px 0 34px;
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-pill);
  transition:var(--tr);
}
#searchInput:focus{ background:var(--surface); border-color:var(--accent); outline:none; }
.search-clear{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:var(--text-faint); }
.hdr-spacer{ flex:1; }

.icon-btn{
  width:38px; height:38px; border-radius:var(--r-md);
  display:grid; place-items:center; color:var(--text-dim);
  transition:var(--tr);
}
.icon-btn:hover{ background:var(--surface-2); color:var(--text); }
.icon-btn.on{ color:var(--accent-hi); background:var(--accent-soft); }

#syncBtn{ display:flex; align-items:center; gap:7px; height:34px; padding:0 11px; border-radius:var(--r-pill); background:var(--surface-2); font-size:var(--fs-xs); color:var(--text-dim); letter-spacing:.02em; }
.sync-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-faint); flex:none; }
.sync-dot[data-s="ok"]{ background:var(--ok); }
.sync-dot[data-s="syncing"]{ background:var(--accent); animation:spinPulse 1s linear infinite; }
.sync-dot[data-s="pending"]{ background:var(--warn); }
.sync-dot[data-s="error"]{ background:var(--danger); }
.sync-dot[data-s="off"]{ background:var(--text-faint); }
@keyframes spinPulse{ 0%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.72)} 100%{opacity:1;transform:scale(1)} }

#sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:var(--sp-4) var(--sp-3) var(--sp-5);
  overflow-y:auto;
  display:flex; flex-direction:column; gap:var(--sp-4);
}
.side-group-label{ font-size:10px; letter-spacing:.14em; color:var(--text-faint); padding:0 10px var(--sp-2); text-transform:uppercase; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  width:100%; min-height:38px; padding:0 10px;
  border-radius:var(--r-md); color:var(--text-dim);
  font-size:var(--fs-sm); text-align:left; transition:var(--tr);
}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent-hi); }
.nav-item .ni-ico{ width:18px; display:grid; place-items:center; flex:none; }
.nav-item .ni-label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-count{ font-size:var(--fs-xs); color:var(--text-faint); background:var(--surface-2); border-radius:var(--r-pill); padding:1px 7px; min-width:22px; text-align:center; }
.nav-item.active .nav-count{ background:var(--surface); color:var(--accent-hi); }
.nav-count.alert{ background:var(--danger); color:#fff; }
.cat-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.side-foot{ margin-top:auto; display:flex; flex-direction:column; gap:var(--sp-2); }

#bottomNav{ display:none; }
#fab{ display:none; }

/* ---------- [5] COMPONENTS ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:40px; padding:0 16px; border-radius:var(--r-md);
  background:var(--surface-2); color:var(--text);
  border:1px solid transparent; transition:var(--tr); font-size:var(--fs-sm);
  white-space:nowrap;
}
.btn:hover{ background:var(--surface-3); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ background:var(--accent-hi); }
.btn-outline{ background:transparent; border-color:var(--border-strong); color:var(--text-dim); }
.btn-outline:hover{ background:var(--surface-2); color:var(--text); }
.btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
.btn-danger:hover{ background:var(--danger); color:#fff; }
.btn-sm{ min-height:32px; padding:0 11px; font-size:var(--fs-xs); border-radius:var(--r-sm); }
.btn-block{ width:100%; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-1); }
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:var(--sp-4); }

.field{ display:flex; flex-direction:column; gap:6px; }
.field > label{ font-size:var(--fs-xs); color:var(--text-dim); letter-spacing:.04em; }
.inp,.sel,.txt{
  width:100%; min-height:40px; padding:9px 12px;
  background:var(--surface-2); color:var(--text);
  border:1px solid var(--border); border-radius:var(--r-md);
  transition:var(--tr);
}
.inp:focus,.sel:focus,.txt:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
.txt{ min-height:84px; resize:vertical; line-height:1.5; }
.sel{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%); background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:32px; }

.switch{ position:relative; width:44px; height:26px; flex:none; }
.switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--surface-3); border-radius:99px; transition:var(--tr); pointer-events:none; }
.switch .knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow-1); transition:var(--tr); pointer-events:none; }
.switch input:checked ~ .track{ background:var(--accent); }
.switch input:checked ~ .knob{ transform:translateX(18px); }

.row-line{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; border-bottom:1px solid var(--border); }
.row-line:last-child{ border-bottom:none; }
.row-line .rl-main{ flex:1; min-width:0; }
.row-line .rl-title{ font-size:var(--fs-sm); }
.row-line .rl-desc{ font-size:var(--fs-xs); color:var(--text-faint); margin-top:2px; }

.seg{ display:inline-flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; gap:3px; flex-wrap:wrap; }
.seg button{ min-height:32px; padding:0 12px; border-radius:9px; font-size:var(--fs-xs); color:var(--text-dim); transition:var(--tr); }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
html[data-mode="dark"] .seg button.on{ background:var(--surface-3); }

.empty{ text-align:center; padding:56px 20px; color:var(--text-dim); }
.empty .e-ico{ font-size:44px; line-height:1; margin-bottom:var(--sp-3); filter:grayscale(.15); }
.empty .e-title{ font-size:var(--fs-lg); color:var(--text); margin-bottom:6px; }
.empty .e-text{ font-size:var(--fs-sm); max-width:340px; margin:0 auto; }
.empty .e-bar{ width:52px; height:4px; border-radius:99px; background:var(--accent); margin:var(--sp-4) auto 0; }

/* ---------- [6] OVERLAYS ---------- */
#identityScreen{
  position:fixed; inset:0; z-index:200;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  padding:var(--sp-5);
}
.id-card{ width:100%; max-width:420px; text-align:center; }
.id-mark{ width:60px; height:60px; margin:0 auto var(--sp-4); }
.id-mark svg{ width:100%; height:100%; display:block; }
.id-title{ font-size:var(--fs-xxl); letter-spacing:-.03em; }
.id-sub{ color:var(--text-dim); font-size:var(--fs-sm); margin-top:6px; }
.id-choices{ display:grid; gap:var(--sp-3); margin-top:var(--sp-6); }
.id-choice{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-4); border-radius:var(--r-lg);
  background:var(--surface); border:2px solid var(--border);
  transition:var(--tr); text-align:left;
}
.id-choice:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-2); }
.id-av{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-hi); font-size:var(--fs-lg); flex:none; }
.id-name{ font-size:var(--fs-lg); }
.id-role{ font-size:var(--fs-xs); color:var(--text-faint); }
.id-foot{ margin-top:var(--sp-6); font-size:10px; letter-spacing:.12em; color:var(--text-faint); }

#modalRoot{ position:fixed; inset:0; z-index:150; display:none; }
#modalRoot.open{ display:block; }
.modal-scrim{ position:absolute; inset:0; background:var(--overlay); animation:fadeIn 140ms ease; }
.modal-box{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(660px,calc(100vw - 32px)); max-height:min(92dvh,900px);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-3); display:flex; flex-direction:column;
  animation:popIn 160ms cubic-bezier(.2,.8,.3,1);
}
.modal-box.wide{ width:min(880px,calc(100vw - 32px)); }
.modal-head{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-4); border-bottom:1px solid var(--border); }
.modal-title{ font-size:var(--fs-lg); flex:1; letter-spacing:-.02em; }
.modal-body{ padding:var(--sp-4); overflow-y:auto; flex:1; }
.modal-foot{ padding:var(--sp-3) var(--sp-4); border-top:1px solid var(--border); display:flex; gap:var(--sp-2); justify-content:flex-end; flex-wrap:wrap; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes popIn{ from{opacity:0; transform:translate(-50%,-46%) scale(.97)} to{opacity:1; transform:translate(-50%,-50%) scale(1)} }
@keyframes sheetIn{ from{transform:translateY(100%)} to{transform:translateY(0)} }

#toastRoot{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--sp-5) + env(safe-area-inset-bottom));
  z-index:300; display:flex; flex-direction:column; gap:var(--sp-2);
  width:min(460px,calc(100vw - 24px)); pointer-events:none;
}
.toast{
  display:flex; align-items:center; gap:var(--sp-3);
  background:var(--surface); border:1px solid var(--border-strong);
  box-shadow:var(--shadow-3); border-radius:var(--r-md);
  padding:11px var(--sp-3) 11px var(--sp-4); pointer-events:auto;
  animation:toastIn 180ms cubic-bezier(.2,.8,.3,1);
}
.toast.out{ animation:toastOut 160ms ease forwards; }
.toast .t-msg{ flex:1; font-size:var(--fs-sm); }
.toast .t-act{ color:var(--accent-hi); font-size:var(--fs-xs); letter-spacing:.06em; padding:6px 10px; border-radius:var(--r-sm); background:var(--accent-soft); }
.toast[data-kind="error"]{ border-color:var(--danger); }
.toast[data-kind="error"] .t-msg{ color:var(--danger); }
@keyframes toastIn{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
@keyframes toastOut{ to{opacity:0; transform:translateY(8px)} }

/* ---------- [6b] TASK UI (Phase 2) ---------- */
.qadd{
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:6px 6px 6px 14px; margin-bottom:var(--sp-4); box-shadow:var(--shadow-1);
}
.qadd input{ flex:1; min-width:0; border:none; background:transparent; min-height:38px; color:var(--text); }
.qadd input:focus{ outline:none; }

.tsec{ margin-bottom:var(--sp-5); }
.tsec-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:var(--sp-2); padding:0 2px; }
.tsec-title{ font-size:var(--fs-sm); color:var(--text-dim); letter-spacing:.02em; }
.tsec-head.is-over .tsec-title{ color:var(--danger); }
.tsec-count{ font-size:var(--fs-xs); color:var(--text-faint); background:var(--surface-2); border-radius:99px; padding:1px 8px; }

.tlist{ display:flex; flex-direction:column; gap:8px; }
.tcard{
  position:relative; display:flex; gap:11px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:12px 14px 12px 17px; cursor:pointer; overflow:hidden;
  box-shadow:var(--shadow-1); transition:var(--tr);
}
.tcard::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--pbar,transparent); }
.tcard:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-2); }
.tcard.done{ opacity:.72; }
.tcard.done .tc-title{ text-decoration:line-through; color:var(--text-faint); }
.tc-check{
  width:24px; height:24px; border-radius:50%; flex:none; margin-top:1px;
  border:2px solid var(--border-strong); color:transparent;
  display:grid; place-items:center; transition:var(--tr);
}
.tc-check:hover{ border-color:var(--ok); color:var(--ok); }
.tcard.done .tc-check{ background:var(--ok); border-color:var(--ok); color:#fff; }
.tc-main{ flex:1; min-width:0; }
.tc-title{ word-break:break-word; }
.tc-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px; margin-top:6px; font-size:var(--fs-xs); color:var(--text-faint); }
.tc-cat{ display:inline-flex; align-items:center; gap:5px; color:var(--text-dim); }
.tc-chip{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:99px; background:var(--surface-2); color:var(--text-dim); }
.tc-chip.due-today{ background:var(--accent-soft); color:var(--accent-hi); }
.tc-chip.od1{ background:var(--warn); color:#fff; }
.tc-chip.od3{ background:var(--danger); color:#fff; animation:duePulse 1.15s ease-in-out infinite; }
@keyframes duePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
.tc-badge{ background:var(--accent); color:var(--accent-ink); border-radius:99px; padding:2px 9px; font-size:10px; letter-spacing:.03em; }
.tc-age{ font-size:10px; }
.tc-pri{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; flex:none; margin-top:4px; }
.tc-prog-wrap{ display:inline-flex; align-items:center; gap:6px; }
.tc-prog{ width:52px; height:4px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:inline-block; }
.tc-prog-fill{ display:block; height:100%; background:var(--accent); border-radius:99px; }

.chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:var(--sp-3); }
.chip{
  min-height:34px; padding:0 13px; border-radius:99px; white-space:nowrap;
  background:var(--surface); border:1px solid var(--border-strong); color:var(--text-dim);
  font-size:var(--fs-xs); display:inline-flex; align-items:center; gap:6px; transition:var(--tr);
}
.chip:hover{ border-color:var(--accent); color:var(--text); }
.chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

.ctrlbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:var(--sp-3); }
.ctrlbar .sel{ width:auto; min-height:34px; padding:4px 30px 4px 10px; font-size:var(--fs-xs); }
.fbadge{ background:var(--accent-ink); color:var(--accent); border-radius:99px; font-size:10px; min-width:17px; height:17px; display:inline-grid; place-items:center; padding:0 4px; }
.btn-outline .fbadge{ background:var(--accent); color:var(--accent-ink); }

.fpanel{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--sp-3); margin-bottom:var(--sp-3);
}
.fpanel .sel{ min-height:36px; }

.grp-head{ display:flex; align-items:center; gap:8px; margin:var(--sp-4) 2px var(--sp-2); font-size:var(--fs-sm); color:var(--text-dim); }

/* detail modal */
.dt-title{
  width:100%; border:none; background:transparent; color:var(--text);
  font-size:var(--fs-xl); letter-spacing:-.02em; padding:2px 0 6px;
  border-bottom:2px solid transparent;
}
.dt-title:focus{ outline:none; border-bottom-color:var(--accent); }
.dt-sub{ font-size:var(--fs-xs); color:var(--text-faint); margin-bottom:var(--sp-2); }
.dt-label{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin:var(--sp-4) 0 8px; }
.dt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.dt-none{ font-size:var(--fs-xs); color:var(--text-faint); }

.cmt-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.cmt{ background:var(--surface-2); border-radius:var(--r-md); padding:9px 12px; }
.cmt-head{ display:flex; gap:8px; font-size:var(--fs-xs); color:var(--text-faint); margin-bottom:2px; }
.cmt-author{ color:var(--accent-hi); }
.cmt-text{ font-size:var(--fs-sm); white-space:pre-wrap; word-break:break-word; }

.act{ margin-top:var(--sp-4); border-top:1px solid var(--border); padding-top:var(--sp-3); }
.act summary{ cursor:pointer; font-size:var(--fs-xs); color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; }
.act ul{ margin-top:8px; display:flex; flex-direction:column; gap:6px; }
.act li{ font-size:var(--fs-xs); color:var(--text-dim); }
.act li b{ color:var(--accent-hi); font-weight:inherit; }
.act li time{ color:var(--text-faint); }

/* categories settings */
.catrow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.catrow:last-child{ border-bottom:none; }
.catrow input[type="color"]{ width:34px; height:34px; flex:none; border:none; background:none; padding:0; border-radius:8px; cursor:pointer; }
.catrow .inp{ flex:1; min-height:36px; min-width:0; }
.cat-lock{ font-size:var(--fs-xs); color:var(--text-faint); white-space:nowrap; }

@media (max-width:899px){
  .chips{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ min-height:40px; }
  .dt-grid{ grid-template-columns:1fr; }
  .tc-pri{ display:none; }
  .tc-check{ width:30px; height:30px; }
}

/* ---------- [6c] LOCK SCREEN ---------- */
#lockScreen{ position:fixed; inset:0; z-index:400; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:var(--sp-5); }
.lock-card{ max-width:340px; }
#lockForm{ margin-top:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-2); }
.lock-input{ text-align:center; letter-spacing:.12em; min-height:46px; }
.lock-err{ min-height:18px; color:var(--danger); font-size:var(--fs-sm); }
.shake{ animation:shakeX .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes shakeX{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(5px); }
  30%,50%,70%{ transform:translateX(-8px); }
  40%,60%{ transform:translateX(8px); }
}

/* ---------- [6d] PHASE 3 - board, archive, swipe, subtasks, links ---------- */
.board{ display:grid; grid-template-columns:repeat(4,minmax(225px,1fr)); gap:12px; align-items:start; }
.bcol{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-lg); padding:10px; min-height:120px; }
html[data-mode="dark"] .bcol{ background:var(--surface); }
.bcol.dragover{ outline:2px dashed var(--accent); outline-offset:2px; }
.bcol-head{ display:flex; align-items:center; gap:8px; padding:2px 4px 10px; }
.bcol-title{ font-size:var(--fs-sm); color:var(--text-dim); }
.bcol .tcard{ padding:10px 12px 10px 15px; background:var(--surface); }
.bcol .tcard[draggable="true"]{ cursor:grab; }
.bcol .tcard.dragging{ opacity:.45; }
.bcol-empty{ text-align:center; color:var(--text-faint); padding:18px 0; font-size:var(--fs-sm); }
.bstatus{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 2px 2px; }
.bexp{ background:var(--accent-soft); border-radius:var(--r-md); padding:4px; }

.swipe-wrap{ position:relative; border-radius:var(--r-md); }
.swipe-bg{
  position:absolute; inset:0; border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; color:#fff; font-size:var(--fs-sm); opacity:0; transition:opacity .12s;
}
.swipe-wrap.sw-r .swipe-bg{ opacity:1; background:var(--ok); }
.swipe-wrap.sw-l .swipe-bg{ opacity:1; background:var(--warn); }
.swipe-wrap .tcard{ touch-action:pan-y; }

.st-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.st-row{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:var(--r-sm); padding:7px 9px; }
.st-row.done .st-text{ text-decoration:line-through; color:var(--text-faint); }
.st-chk{
  width:20px; height:20px; border-radius:6px; flex:none;
  border:2px solid var(--border-strong); color:transparent;
  display:grid; place-items:center; transition:var(--tr);
}
.st-chk:hover{ border-color:var(--ok); color:var(--ok); }
.st-row.done .st-chk{ background:var(--ok); border-color:var(--ok); color:#fff; }
.st-text{ flex:1; min-width:0; font-size:var(--fs-sm); word-break:break-word; }
.st-btn{ width:26px; height:26px; border-radius:6px; color:var(--text-faint); display:grid; place-items:center; font-size:12px; flex:none; }
.st-btn:hover{ background:var(--surface-3); color:var(--text); }
.st-btn:disabled{ opacity:.3; cursor:default; }
.st-del:hover{ color:var(--danger); }

.lk-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.lk-row{ display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:var(--r-sm); padding:7px 9px; min-width:0; }
.lk-a{ font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; flex:none; }
.lk-url{ flex:1; min-width:0; font-size:var(--fs-xs); color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lk-add{ display:flex; gap:8px; }
.lk-add .inp:first-child{ max-width:130px; }

.rec-row{ display:flex; gap:8px; align-items:center; }
.rec-row .sel{ width:auto; }

.dt-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

@media (max-width:899px){
  .board{
    display:flex; overflow-x:auto; gap:10px;
    scroll-snap-type:x mandatory;
    margin:0 -12px; padding:0 12px 6px;
  }
  .bcol{ min-width:min(82vw,330px); scroll-snap-align:center; flex:none; }
  .lk-add{ flex-wrap:wrap; }
  .lk-add .inp:first-child{ max-width:none; }
}

/* ---------- [6e] SYNC WIZARD ---------- */
.wiz-quick{ background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-md); padding:12px; margin-bottom:6px; }
.wiz-step{ border-top:1px solid var(--border); padding:14px 0 10px; }
.wiz-step:first-of-type{ border-top:none; }
.wiz-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.wiz-num{ width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:12px; flex:none; }
.wiz-title{ font-size:var(--fs-md); }
.wiz-p{ font-size:var(--fs-sm); color:var(--text-dim); line-height:1.55; margin:4px 0 8px; }
.boss-badge{ background:var(--danger) !important; color:#fff !important; }

/* ---------- [6f] ATTACHMENTS ---------- */
.att-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; margin-bottom:10px; }
.att-tile{
  position:relative; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-md); padding:8px; cursor:pointer; text-align:center; transition:var(--tr);
  min-width:0;
}
.att-tile:hover{ border-color:var(--accent); }
.att-tile.pending{ opacity:.78; border-style:dashed; }
.att-img{ width:100%; height:64px; object-fit:cover; border-radius:8px; display:block; background:var(--surface-3); }
.att-ico{ height:64px; display:grid; place-items:center; font-size:30px; background:var(--surface-3); border-radius:8px; }
.att-name{ font-size:var(--fs-xs); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.att-meta{ font-size:10px; color:var(--text-faint); margin-top:2px; }
.att-del{
  position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border-strong); color:var(--text-faint);
  font-size:11px; display:grid; place-items:center;
}
.att-del:hover{ color:var(--danger); border-color:var(--danger); }
.att-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ---------- [6g] DIGEST + WORKING DAYS ---------- */
.dg-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.dg-cell{ background:var(--surface-2); border-radius:var(--r-md); padding:14px 8px; text-align:center; }
.dg-cell.is-over{ background:var(--danger); color:#fff; }
.dg-cell.is-due{ background:var(--accent); color:var(--accent-ink); }
.dg-num{ font-size:28px; line-height:1.1; letter-spacing:-.02em; }
.dg-label{ font-size:var(--fs-xs); opacity:.85; margin-top:2px; }
.wd-row{ display:flex; gap:6px; flex-wrap:wrap; }
.wd-chip{ min-height:36px; padding:0 11px; }

/* ---------- [6h] PHASE 7 - stats, WA, import, print, footer ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px; box-shadow:var(--shadow-1); }
.stat-num{ font-size:30px; letter-spacing:-.02em; line-height:1.1; }
.stat-label{ font-size:var(--fs-xs); color:var(--text-dim); margin-top:4px; }
.stat-card.warn .stat-num{ color:var(--danger); }

.chart7{ display:flex; gap:8px; align-items:flex-end; height:130px; padding:6px 4px 0; }
.c7-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; min-width:0; }
.c7-bar{ width:100%; max-width:38px; background:var(--accent); border-radius:6px 6px 0 0; }
.c7-n{ font-size:var(--fs-xs); color:var(--text-dim); min-height:16px; }
.c7-d{ font-size:10px; color:var(--text-faint); white-space:nowrap; }

.wa-out{ font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:12px; line-height:1.5; margin-top:12px; min-height:180px; white-space:pre-wrap; }
html[data-font="snpro"] .wa-out{ font-weight:400; }

.pi-prev{ max-height:180px; overflow:auto; background:var(--surface-2); border-radius:var(--r-md); padding:8px 12px; display:flex; flex-direction:column; gap:4px; }
.pi-row{ font-size:var(--fs-sm); }

.kbd{
  display:inline-grid; place-items:center; min-width:30px; height:28px; padding:0 8px;
  background:var(--surface-2); border:1px solid var(--border-strong); border-bottom-width:2px;
  border-radius:8px; font-size:12px; flex:none;
}

.foot-btn{
  width:24px; height:24px; border-radius:50%; flex:none;
  border:1px solid var(--border-strong); color:var(--text-faint);
  font-size:12px; display:grid; place-items:center; transition:var(--tr);
}
.foot-btn:hover{ color:var(--text); border-color:var(--text-dim); }

/* ---------- PRINT ---------- */
#printSheet{ display:none; }
@media print{
  #app, #identityScreen, #lockScreen, #modalRoot, #toastRoot, #bottomNav, #fab{ display:none !important; }
  body{ background:#fff !important; }
  #printSheet{ display:block !important; color:#000; font-family:Arial,Helvetica,sans-serif; font-weight:400; padding:0; }
  #printSheet h1{ font-size:18px; margin:0 0 2px; font-weight:700; }
  #printSheet .pr-head div{ font-size:11px; color:#555; margin-bottom:14px; }
  #printSheet h2{ font-size:14px; font-weight:700; border-bottom:1.5px solid #000; padding-bottom:3px; margin:18px 0 6px; }
  #printSheet .pr-row{ padding:5px 0; border-bottom:1px solid #ccc; page-break-inside:avoid; }
  #printSheet .pr-title{ font-size:12px; font-weight:700; }
  #printSheet .pr-meta{ font-size:10px; color:#444; margin-top:1px; }
  #printSheet .pr-notes{ font-size:10px; color:#333; white-space:pre-wrap; margin-top:2px; }
}

/* ---------- [7] RESPONSIVE ---------- */
@media (max-width:899px){
  #app{
    grid-template-columns:1fr;
    grid-template-rows:var(--header-h) 1fr;
    grid-template-areas:"header" "main";
    padding-bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom));
  }
  #brandBox{ display:none; }
  #sidebar{ display:none; }
  #appHeader{ padding:0 var(--sp-3); gap:6px; }
  #main{ padding:var(--sp-3); }
  .view{ max-width:none; }
  .view-title{ font-size:var(--fs-lg); }
  #appFooter{ padding:var(--sp-3) var(--sp-3) var(--sp-5); }

  .m-brand{ display:flex; align-items:center; gap:8px; }
  #searchInput{ height:40px; font-size:var(--fs-md); }
  .search-wrap{ max-width:none; }
  #syncBtn{ width:34px; padding:0; justify-content:center; }
  #syncLabel{ display:none; }
  .hdr-spacer{ display:none; }   /* desktop-only gap - search takes the row */

  #bottomNav{
    display:grid; grid-template-columns:repeat(5,1fr);
    position:fixed; left:0; right:0; bottom:0; z-index:90;
    height:calc(var(--bnav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface); border-top:1px solid var(--border);
  }
  .bnav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-height:var(--tap); color:var(--text-faint); font-size:10px; letter-spacing:.03em;
    position:relative; transition:var(--tr);
  }
  .bnav-item.active{ color:var(--accent-hi); }
  .bnav-item .bn-ico{ display:grid; place-items:center; height:22px; }
  .bnav-badge{
    position:absolute; top:6px; left:calc(50% + 6px);
    min-width:16px; height:16px; padding:0 4px; border-radius:99px;
    background:var(--danger); color:#fff; font-size:9px;
    display:grid; place-items:center;
  }
  #quickAddBtn{ display:none; }   /* the FAB + quick-add bar cover mobile */
  #fab{
    display:grid; place-items:center; position:fixed; z-index:95;
    right:16px; bottom:calc(var(--bnav-h) + 16px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:20px;
    background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-3);
  }
  #fab:active{ transform:scale(.94); }

  .modal-box{
    left:0; top:auto; bottom:0; transform:none;
    width:100%; max-width:none; max-height:92dvh;
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    border-bottom:none; animation:sheetIn 200ms cubic-bezier(.2,.8,.3,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .modal-box::before{
    content:""; display:block; width:38px; height:4px; border-radius:99px;
    background:var(--border-strong); margin:8px auto 0; flex:none;
  }
  #toastRoot{ bottom:calc(var(--bnav-h) + 12px + env(safe-area-inset-bottom)); }
  .btn{ min-height:var(--tap); }
  .btn-sm{ min-height:44px; }
  .icon-btn{ width:44px; height:44px; }
  .chip{ min-height:44px; }
  .seg button{ min-height:44px; }
  .ctrlbar .sel, .fpanel .sel{ min-height:44px; }
  .search-clear{ width:34px; height:34px; }
  /* small visual controls get an invisible expanded hit area */
  .tc-check{ position:relative; }
  .tc-check::before{ content:""; position:absolute; inset:-8px; border-radius:50%; }
  .st-btn{ width:34px; height:34px; position:relative; }
  .st-btn::before{ content:""; position:absolute; inset:-6px; }
  .st-chk{ position:relative; }
  .st-chk::before{ content:""; position:absolute; inset:-12px; }
  .att-del{ width:28px; height:28px; position:relative; }
  .att-del::before{ content:""; position:absolute; inset:-8px; }
  .switch input{ top:-9px; left:-9px; width:calc(100% + 18px); height:calc(100% + 18px); }
}
@media (max-width:899px){
  .foot-btn{ display:none; }
}
@media (max-width:360px){
  #main{ padding:10px; }
  .id-title{ font-size:var(--fs-xl); }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>

<body>

<!-- ============ LOCK SCREEN ============ -->

<script type="text/plain" id="gsSource">
/**
 * TaskHub - Google Apps Script backend  v1.0
 *
 * SETUP
 *  1. Create a Google Sheet (any name, e.g. "TaskHub").
 *  2. Extensions → Apps Script → delete the boilerplate → paste this file → Save.
 *  3. Deploy → New deployment → type: Web app
 *       Execute as:      Me
 *       Who has access:  Anyone
 *     Deploy, authorize, and copy the Web app URL (ends in /exec).
 *  4. Paste that URL into TaskHub → Settings → Sync.
 *
 * The script creates two sheets automatically:
 *   "Tasks"  - one row per task, complex fields stored as JSON strings
 *   "Config" - shared settings (partner display name)
 * Attachments are saved to a Drive folder named "TaskHub Attachments".
 */

var TASKS_SHEET  = 'Tasks';
var CONFIG_SHEET = 'Config';
var FOLDER_NAME  = 'TaskHub Attachments';
var MAX_UPLOAD   = 10 * 1024 * 1024;   // 10MB

var COLS = ['id','title','notes','status','priority','category','dueDate',
  'assignedBy','createdBy','pinned','recurrence','subtasks','links',
  'attachments','comments','activity','createdAt','updatedAt','completedAt','deleted'];

var JSON_COLS = { recurrence:1, subtasks:1, links:1, attachments:1, comments:1, activity:1 };
var BOOL_COLS = { pinned:1, deleted:1 };

function doGet(e){ return handle(e); }
function doPost(e){ return handle(e); }

function handle(e){
  var out;
  try{
    var req = {};
    if (e && e.postData && e.postData.contents) req = JSON.parse(e.postData.contents);
    else if (e && e.parameter) req = e.parameter;
    var action = req.action || 'pull';
    if (action === 'push') out = doPush(req);
    else if (action === 'uploadFile') out = doUpload(req);
    else if (action === 'ping') out = { pong: true };
    else out = doPull(req);
    out.ok = true;
  }catch(err){
    out = { ok: false, error: String(err && err.message || err) };
  }
  out.serverTime = new Date().toISOString();
  return ContentService
    .createTextOutput(JSON.stringify(out))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ---------------- sheets ---------------- */

function sheet(name, header){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(name);
  if (!sh){
    sh = ss.insertSheet(name);
    // plain-text format everywhere so dates/ISO strings are never coerced
    sh.getRange(1, 1, sh.getMaxRows(), header.length).setNumberFormat('@');
    sh.getRange(1, 1, 1, header.length).setValues([header]).setFontWeight('bold');
    sh.setFrozenRows(1);
  }
  return sh;
}

function readTasks(sh){
  var last = sh.getLastRow();
  var list = [], rowById = {};
  if (last >= 2){
    var values = sh.getRange(2, 1, last - 1, COLS.length).getValues();
    for (var i = 0; i < values.length; i++){
      var t = rowToTask(values[i]);
      if (!t || !t.id) continue;
      list.push(t);
      rowById[t.id] = { row: i + 2, updatedAt: t.updatedAt, task: t };
    }
  }
  return { list: list, rowById: rowById };
}

function rowToTask(row){
  var t = {};
  for (var i = 0; i < COLS.length; i++){
    var h = COLS[i], v = row[i];
    if (v instanceof Date) v = v.toISOString();
    if (JSON_COLS[h]){
      if (v === '' || v == null) t[h] = (h === 'recurrence') ? null : [];
      else { try{ t[h] = JSON.parse(v); }catch(err){ t[h] = (h === 'recurrence') ? null : []; } }
    } else if (BOOL_COLS[h]){
      t[h] = (v === true || v === 'true' || v === 'TRUE' || v === 1 || v === '1');
    } else if (h === 'dueDate' || h === 'completedAt'){
      t[h] = (v === '' || v == null) ? null : String(v);
    } else {
      t[h] = (v == null) ? '' : String(v);
    }
  }
  t.personal = false;   // personal tasks never live in the Sheet
  return t;
}

function taskToRow(t){
  var row = [];
  for (var i = 0; i < COLS.length; i++){
    var h = COLS[i], v = t[h];
    if (JSON_COLS[h]) row.push(v ? JSON.stringify(v) : (h === 'recurrence' ? '' : '[]'));
    else if (BOOL_COLS[h]) row.push(v ? 'true' : 'false');
    else row.push(v == null ? '' : String(v));
  }
  return row;
}

/* ---------------- pull ---------------- */

function doPull(req){
  var sh = sheet(TASKS_SHEET, COLS);
  return { tasks: readTasks(sh).list, config: readConfig() };
}

/* ---------------- push (upsert, newer updatedAt wins) ---------------- */

function doPush(req){
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try{
    var sh = sheet(TASKS_SHEET, COLS);
    var data = readTasks(sh);
    var incoming = req.tasks || [];
    var conflicts = [];
    for (var i = 0; i < incoming.length; i++){
      var t = incoming[i];
      if (!t || !t.id) continue;
      if (t.personal) continue;                       // hard rule: never store personal tasks
      var existing = data.rowById[t.id];
      if (!existing){
        sh.appendRow(taskToRow(t));
        sh.getRange(sh.getLastRow(), 1, 1, COLS.length).setNumberFormat('@');
        data.rowById[t.id] = { row: sh.getLastRow(), updatedAt: t.updatedAt, task: t };
      } else if (String(t.updatedAt) > String(existing.updatedAt)){
        sh.getRange(existing.row, 1, 1, COLS.length).setValues([taskToRow(t)]);
        existing.updatedAt = t.updatedAt;
        existing.task = t;
      } else if (String(t.updatedAt) < String(existing.updatedAt)){
        conflicts.push(existing.task);                // server is newer → client adopts this row
      }
    }
    return { conflicts: conflicts, config: writeConfig(req.config) };
  } finally {
    lock.releaseLock();
  }
}

/* ---------------- shared config (partner display name) ---------------- */

function readConfig(){
  var sh = sheet(CONFIG_SHEET, ['key','value','at']);
  var last = sh.getLastRow();
  var map = {};
  if (last >= 2){
    var values = sh.getRange(2, 1, last - 1, 3).getValues();
    for (var i = 0; i < values.length; i++){
      var v1 = values[i][1], v2 = values[i][2];
      if (v1 instanceof Date) v1 = v1.toISOString();
      if (v2 instanceof Date) v2 = v2.toISOString();
      map[String(values[i][0])] = { value: String(v1), at: String(v2) };
    }
  }
  return {
    partnerName: map.partnerName ? map.partnerName.value : null,
    at:          map.partnerName ? map.partnerName.at : null
  };
}

function writeConfig(incoming){
  if (incoming && incoming.partnerName && incoming.at){
    var sh = sheet(CONFIG_SHEET, ['key','value','at']);
    var cur = readConfig();
    if (!cur.at || String(incoming.at) > String(cur.at)){
      var last = sh.getLastRow(), row = -1;
      if (last >= 2){
        var keys = sh.getRange(2, 1, last - 1, 1).getValues();
        for (var i = 0; i < keys.length; i++){
          if (String(keys[i][0]) === 'partnerName'){ row = i + 2; break; }
        }
      }
      if (row === -1) sh.appendRow(['partnerName', String(incoming.partnerName), String(incoming.at)]);
      else sh.getRange(row, 2, 1, 2).setValues([[String(incoming.partnerName), String(incoming.at)]]);
    }
  }
  return readConfig();
}

/* ---------------- file upload → Drive (used by attachments) ---------------- */

function doUpload(req){
  if (!req.data || !req.name) throw new Error('Missing file data or name');
  var bytes = Utilities.base64Decode(req.data);
  if (bytes.length > MAX_UPLOAD) throw new Error('File exceeds 10MB limit');
  var blob = Utilities.newBlob(bytes, req.mimeType || 'application/octet-stream', req.name);
  var it = DriveApp.getFoldersByName(FOLDER_NAME);
  var folder = it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER_NAME);
  var file = folder.createFile(blob);
  file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
  var isImage = String(req.mimeType || '').indexOf('image/') === 0;
  return {
    driveUrl: file.getUrl(),
    thumbUrl: isImage ? ('https://drive.google.com/thumbnail?sz=w400&id=' + file.getId()) : null,
    fileId: file.getId()
  };
}
</script>

const DEFAULT_META = {
  pendingSync: [],
  lastSync: null,
  lastSeenAt: null,          /* server-time marker for new-from-partner detection */
  lastDigestDate: null,
  bossBadge: 0,
  setupDone: false,

  configDirty: false,
  lastDueNotifyDate: null,   /* IST day the due-today reminder already fired */
  lastNagAt: null            /* last overdue nag timestamp */
};

/* ------------------------------------------------------------
   1. TINY UTILITIES
   ------------------------------------------------------------ */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function el(tag, attrs, children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  if (children != null){
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null || c === false) return;
      n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
  }
  return n;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function uid(prefix){
  const r = Math.random().toString(36).slice(2,6);
  return prefix + '_' + Date.now().toString(36) + '_' + r;
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function debounce(fn, ms){
  let t;
  return function(){
    const a = arguments, c = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(c, a), ms);
  };
}

function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }

/* ------------------------------------------------------------
   2. IST DATE / TIME  (UTC+5:30, DD/MM/YYYY, HH:mm 24h)
   ------------------------------------------------------------ */
const IST_OFFSET_MIN = 330;

/* Returns a Date object shifted so that its UTC fields equal IST wall-clock. */
function istShift(d){
  const base = d ? new Date(d) : new Date();
  return new Date(base.getTime() + IST_OFFSET_MIN * 60000);
}

/* YYYY-MM-DD of the IST calendar day for a given instant (default: now). */
function istDateKey(d){
  const s = istShift(d);
  if (isNaN(s.getTime())) return '';
  return s.getUTCFullYear() + '-' + pad2(s.getUTCMonth()+1) + '-' + pad2(s.getUTCDate());
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

/* Parse 'YYYY-MM-DD' into {y,m,d} - no timezone drift. */
function parseDateKey(key){
  if (!key || typeof key !== 'string') return null;
  const p = key.split('-');
  if (p.length !== 3) return null;
  const y = +p[0], m = +p[1], d = +p[2];
  if (!y || !m || !d) return null;
  return { y:y, m:m, d:d };
}

/* Days between two YYYY-MM-DD keys (b - a). */
function dayDiff(aKey, bKey){
  const a = parseDateKey(aKey), b = parseDateKey(bKey);
  if (!a || !b) return 0;
  const ua = Date.UTC(a.y, a.m-1, a.d), ub = Date.UTC(b.y, b.m-1, b.d);
  return Math.round((ub - ua) / 86400000);
}

/* Shift a YYYY-MM-DD key by n days. */
function addDaysKey(key, n){
  const p = parseDateKey(key);
  if (!p) return key;
  const dt = new Date(Date.UTC(p.y, p.m-1, p.d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth()+1) + '-' + pad2(dt.getUTCDate());
}

/* Weekday index (0=Sun) of a YYYY-MM-DD key. */
function weekdayOfKey(key){
  const p = parseDateKey(key);
  if (!p) return 0;
  return new Date(Date.UTC(p.y, p.m-1, p.d)).getUTCDay();
}

/* DD/MM/YYYY from a YYYY-MM-DD key. */
function fmtDate(key){
  const p = parseDateKey(key);
  if (!p) return '';
  return pad2(p.d) + '/' + pad2(p.m) + '/' + p.y;
}

/* DD/MM from a YYYY-MM-DD key. */
function fmtDateShort(key){
  const p = parseDateKey(key);
  if (!p) return '';
  return pad2(p.d) + '/' + pad2(p.m);
}

/* DD/MM/YYYY HH:mm (IST) from an ISO instant. */
function fmtDateTime(iso){
  if (!iso) return '';
  const s = istShift(new Date(iso));
  if (isNaN(s.getTime())) return '';
  return pad2(s.getUTCDate()) + '/' + pad2(s.getUTCMonth()+1) + '/' + s.getUTCFullYear()
       + ' ' + pad2(s.getUTCHours()) + ':' + pad2(s.getUTCMinutes());
}

/* HH:mm (IST) from an ISO instant. */
function fmtTime(iso){
  if (!iso) return '';
  const s = istShift(new Date(iso));
  if (isNaN(s.getTime())) return '';
  return pad2(s.getUTCHours()) + ':' + pad2(s.getUTCMinutes());
}

function nowISO(){ return new Date().toISOString(); }
function todayKey(){ return istDateKey(); }

/* "2m ago" / "3d ago" style, IST-safe (relative to real instants). */
function relTime(iso){
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  if (isNaN(diff)) return '';
  const s = Math.floor(diff/1000);
  if (s < 45) return 'just now';
  const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h/24);
  if (d < 30) return d + 'd ago';
  return fmtDate(istDateKey(new Date(iso)));
}

/* ------------------------------------------------------------
   2b. SAFE STORAGE ADAPTER
   localStorage is the real backing store. If it is unavailable
   (private mode, data: URL, blocked cookies) we fall back to an
   in-memory map so the app still runs - degraded, but never broken.
   ------------------------------------------------------------ */
const Safe = (function(){
  let backend = null;
  let persistent = false;
  try{
    const probe = '__th_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    backend = window.localStorage;
    persistent = true;
  }catch(e){
    const mem = Object.create(null);
    backend = {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; }
    };
    persistent = false;
    console.warn('[TaskHub] localStorage unavailable - running in memory only.');
  }
  return {
    get: k => { try{ return backend.getItem(k); }catch(e){ return null; } },
    set: (k, v) => { backend.setItem(k, v); },       /* may throw on quota - callers handle */
    remove: k => { try{ backend.removeItem(k); }catch(e){} },
    persistent: () => persistent
  };
})();

/* ------------------------------------------------------------
   3. STORE - persistence layer
   ------------------------------------------------------------ */
const Store = (function(){
  let tasks = [];
  let cats = [];
  let settings = clone(DEFAULT_SETTINGS);
  let meta = clone(DEFAULT_META);
  let identity = null;
  let storageOK = true;

  const subs = [];

  let warnedOnce = false;

  function readJSON(key, fallback){
    try{
      const raw = Safe.get(key);
      if (raw == null) return clone(fallback);
      const val = JSON.parse(raw);
      return (val == null) ? clone(fallback) : val;
    }catch(e){
      console.warn('[TaskHub] read failed for ' + key, e);
      return clone(fallback);
    }
  }

  function writeJSON(key, val){
    try{
      Safe.set(key, JSON.stringify(val));
      storageOK = true;
      return true;
    }catch(e){
      /* quota exceeded - surface once, never on every keystroke */
      storageOK = false;
      console.error('[TaskHub] write failed for ' + key, e);
      if (!warnedOnce){
        warnedOnce = true;
        try{ Toast.show('Storage full - changes may not persist. Export your data.', { kind:'error', duration:6000 }); }catch(_){}
      }
      return false;
    }
  }

  function load(){
    tasks    = readJSON(K.tasks, []);
    cats     = readJSON(K.cats, DEFAULT_CATEGORIES);
    settings = Object.assign(clone(DEFAULT_SETTINGS), readJSON(K.settings, {}));
    meta     = Object.assign(clone(DEFAULT_META), readJSON(K.meta, {}));
    identity = Safe.get(K.identity) || null;
    if (identity === 'Boss') identity = 'partner';   /* legacy migration */
    if (identity && IDENTITIES.indexOf(identity) === -1) identity = null;

    if (!Array.isArray(tasks)) tasks = [];
    /* migrate legacy 'Boss' identity stamps to the fixed role id 'partner' */
    tasks.forEach(t => {
      if (t.assignedBy === 'Boss') t.assignedBy = 'partner';
      if (t.createdBy === 'Boss') t.createdBy = 'partner';
      (t.comments || []).forEach(c => { if (c.author === 'Boss') c.author = 'partner'; });
      (t.activity || []).forEach(a => { if (a.who === 'Boss') a.who = 'partner'; });
    });
    if (!Array.isArray(cats) || !cats.length) cats = clone(DEFAULT_CATEGORIES);
    if (!Array.isArray(meta.pendingSync)) meta.pendingSync = [];
    if (!Array.isArray(settings.workingDays) || settings.workingDays.length !== 7){
      settings.workingDays = clone(DEFAULT_SETTINGS.workingDays);
    }
    /* guarantee the locked Personal category always exists */
    if (!cats.some(c => c.personalOnly)){
      cats.push(clone(DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length-1]));
    }
    /* guarantee a General fallback category exists */
    if (!cats.some(c => c.id === 'cat_general')){
      cats.push({ id:'cat_general', name:'General', color:'#8b98a5', personalOnly:false });
    }
  }

  const saveTasks    = debounce(() => writeJSON(K.tasks, tasks), 120);
  const saveCats     = debounce(() => writeJSON(K.cats, cats), 120);
  const saveSettings = debounce(() => writeJSON(K.settings, settings), 120);
  const saveMeta     = debounce(() => writeJSON(K.meta, meta), 120);

  function flush(){
    writeJSON(K.tasks, tasks);
    writeJSON(K.cats, cats);
    writeJSON(K.settings, settings);
    writeJSON(K.meta, meta);
  }

  function emit(what){ subs.forEach(fn => { try{ fn(what); }catch(e){ console.error(e); } }); }

  return {
    load: load,
    flush: flush,
    onChange: fn => { subs.push(fn); },
    emit: emit,

    /* --- tasks --- */
    tasks: () => tasks,
    setTasks: (arr, opts) => { tasks = arr; saveTasks(); if (!opts || !opts.silent) emit('tasks'); },
    getTask: id => tasks.find(t => t.id === id) || null,
    saveTasks: () => { saveTasks(); },

    /* --- categories --- */
    cats: () => cats,
    setCats: arr => { cats = arr; saveCats(); emit('cats'); },
    getCat: id => cats.find(c => c.id === id) || null,
    catName: id => { const c = cats.find(x => x.id === id); return c ? c.name : 'General'; },
    catColor: id => { const c = cats.find(x => x.id === id); return c ? c.color : '#8b98a5'; },
    personalCatId: () => { const c = cats.find(x => x.personalOnly); return c ? c.id : 'cat_personal'; },
    generalCatId: () => { const c = cats.find(x => x.id === 'cat_general'); return c ? c.id : (cats[0] ? cats[0].id : 'cat_general'); },
    saveCats: () => { saveCats(); },

    /* --- settings --- */
    settings: () => settings,
    get: k => settings[k],
    set: (k, v) => { settings[k] = v; saveSettings(); emit('settings'); },
    setMany: obj => { Object.assign(settings, obj); saveSettings(); emit('settings'); },
    resetSettings: () => { settings = clone(DEFAULT_SETTINGS); saveSettings(); emit('settings'); },

    /* --- meta --- */
    meta: () => meta,
    metaGet: k => meta[k],
    metaSet: (k, v) => { meta[k] = v; saveMeta(); },
    metaMerge: obj => { Object.assign(meta, obj); saveMeta(); },
    saveMeta: () => { saveMeta(); },

    /* --- identity --- */
    identity: () => identity,
    setIdentity: name => {
      identity = name;
      try{ Safe.set(K.identity, name); }catch(e){}
      emit('identity');
    },

    /* --- wipe --- */
    clearAll: () => {
      [K.tasks, K.cats, K.settings, K.meta].forEach(k => Safe.remove(k));
      tasks = []; cats = clone(DEFAULT_CATEGORIES);
      settings = clone(DEFAULT_SETTINGS); meta = clone(DEFAULT_META);
      flush(); emit('all');
    },

    storageOK: () => storageOK,
    persistent: () => Safe.persistent()
  };
})();

/* Copy to clipboard with execCommand fallback. */
function copyText(txt, okMsg){
  const done = () => Toast.show(okMsg || 'Copied.');
  const fallback = () => {
    const ta = el('textarea', { style:{ position:'fixed', left:'-9999px', top:'0' } });
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ Toast.show('Copy failed - select and copy manually.', { kind:'error' }); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
}

/* Display name for a role id - 'partner' is renameable in Settings. */
function displayName(roleId){
  if (roleId === 'partner' || roleId === 'Boss') return Store.get('partnerName') || 'Boss';
  return roleId || '?';
}

/* ------------------------------------------------------------
   4. TOAST
   ------------------------------------------------------------ */
const Toast = (function(){
  const root = $('#toastRoot');
  let seq = 0;

  function show(msg, opts){
    opts = opts || {};
    const id = 'toast_' + (++seq);
    const dur = opts.duration != null ? opts.duration : (opts.action ? 5000 : 2800);
    const node = el('div', { class:'toast', 'data-kind': opts.kind || 'info', id:id });
    node.appendChild(el('span', { class:'t-msg', text: msg }));
    let timer = null;
    const kill = () => {
      if (!node.parentNode) return;
      clearTimeout(timer);
      node.classList.add('out');
      setTimeout(() => { if (node.parentNode) node.parentNode.removeChild(node); }, 170);
    };
    if (opts.action){
      node.appendChild(el('button', {
        class:'t-act', text: opts.actionLabel || 'Undo',
        onclick: () => { kill(); try{ opts.action(); }catch(e){ console.error(e); } }
      }));
    }
    root.appendChild(node);
    if (dur > 0) timer = setTimeout(kill, dur);
    return { close: kill };
  }

  return { show: show };
})();

/* ------------------------------------------------------------
   5. MODAL
   ------------------------------------------------------------ */
const Modal = (function(){
  const root = $('#modalRoot');
  const stack = [];

  function open(opts){
    opts = opts || {};
    const scrim = el('div', { class:'modal-scrim' });
    const box = el('div', { class:'modal-box' + (opts.wide ? ' wide' : '') });

    if (opts.title !== null){
      const head = el('div', { class:'modal-head' });
      head.appendChild(el('h2', { class:'modal-title', text: opts.title || '' }));
      if (opts.headExtra) head.appendChild(opts.headExtra);
      if (!opts.noClose){
        head.appendChild(el('button', {
          class:'icon-btn', 'aria-label':'Close', onclick: () => close(inst),
          html:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>'
        }));
      }
      box.appendChild(head);
    }

    const body = el('div', { class:'modal-body' });
    if (opts.body) body.appendChild(opts.body);
    if (opts.bodyHTML) body.innerHTML = opts.bodyHTML;
    box.appendChild(body);

    let foot = null;
    if (opts.footer){ foot = el('div', { class:'modal-foot' }); foot.appendChild(opts.footer); box.appendChild(foot); }

    const layer = el('div', { style:{ position:'absolute', inset:'0' } }, [scrim, box]);
    root.appendChild(layer);
    root.classList.add('open');

    const inst = { layer:layer, box:box, body:body, foot:foot, onClose:opts.onClose, dismissible:opts.dismissible !== false };
    stack.push(inst);
    if (inst.dismissible) scrim.addEventListener('click', () => close(inst));

    setTimeout(() => {
      const f = box.querySelector('[data-autofocus]') || box.querySelector('input,textarea,select,button');
      if (f && opts.autofocus !== false) f.focus();
    }, 60);

    return inst;
  }

  function close(inst){
    if (!stack.length) return;
    const target = inst || stack[stack.length-1];
    const i = stack.indexOf(target);
    if (i === -1) return;
    stack.splice(i, 1);
    if (target.layer.parentNode) target.layer.parentNode.removeChild(target.layer);
    if (!stack.length) root.classList.remove('open');
    if (typeof target.onClose === 'function'){ try{ target.onClose(); }catch(e){ console.error(e); } }
  }

  function closeTop(){
    if (!stack.length) return false;
    const top = stack[stack.length-1];
    if (!top.dismissible) return false;
    close(top);
    return true;
  }

  function anyOpen(){ return stack.length > 0; }

  /* convenience: confirm dialog */
  function confirm(opts){
    return new Promise(resolve => {
      const body = el('div');
      body.appendChild(el('p', { text: opts.message, style:{ fontSize:'var(--fs-sm)', color:'var(--text-dim)', lineHeight:'1.55' } }));
      const foot = el('div', { style:{ display:'flex', gap:'8px' } });
      let done = false;
      const finish = v => { if (done) return; done = true; resolve(v); close(inst); };
      foot.appendChild(el('button', { class:'btn btn-outline', text: opts.cancelLabel || 'Cancel', onclick: () => finish(false) }));
      foot.appendChild(el('button', {
        class:'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary'),
        text: opts.confirmLabel || 'Confirm', onclick: () => finish(true)
      }));
      const inst = open({
        title: opts.title || 'Are you sure?',
        body: body, footer: foot,
        onClose: () => { if (!done){ done = true; resolve(false); } }
      });
    });
  }

  return { open:open, close:close, closeTop:closeTop, anyOpen:anyOpen, confirm:confirm };
})();

/* ------------------------------------------------------------
   6. THEME ENGINE
   ------------------------------------------------------------ */
const Theme = (function(){
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function resolvedMode(){
    const m = Store.get('mode');
    if (m === 'system') return (mq && mq.matches) ? 'dark' : 'light';
    return (m === 'dark') ? 'dark' : 'light';
  }

  function apply(){
    const html = document.documentElement;
    html.setAttribute('data-theme', Store.get('theme') || 'gold');
    html.setAttribute('data-mode', resolvedMode());
    html.setAttribute('data-font', Store.get('font') || 'snpro');
    /* keep the browser chrome in sync with the surface color */
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta){
      const c = getComputedStyle(html).getPropertyValue('--surface').trim();
      if (c) meta.setAttribute('content', c);
    }
  }

  function init(){
    apply();
    if (mq){
      const handler = () => { if (Store.get('mode') === 'system') apply(); };
      if (mq.addEventListener) mq.addEventListener('change', handler);
      else if (mq.addListener) mq.addListener(handler);
    }
  }

  return { init:init, apply:apply, resolvedMode:resolvedMode };
})();

  function go(view, opts){

    const mount = $('#main');

    $$('[data-goto]').forEach(n => n.addEventListener('click', () => Router.go(n.getAttribute('data-goto'))));
  }

  function openQuickAdd(){
    if (typeof TaskUI !== 'undefined' && TaskUI.quickAdd) TaskUI.quickAdd();
    else Toast.show('Task creation arrives in Phase 2.');
  }

  function setBossBadge(n){
    n = +n || 0;
    const item = $('#bottomNav .bnav-item[data-view="today"]');
    if (item){
      let b = item.querySelector('.bnav-badge');
      if (!n){ if (b) b.remove(); }
      else {
        if (!b){ b = el('span', { class:'bnav-badge' }); item.appendChild(b); }
        b.textContent = n > 9 ? '9+' : String(n);
      }
    }
    const side = $('#sideViews .nav-item[data-view="today"]');
    if (side){
      let b = side.querySelector('.boss-badge');
      if (!n){ if (b) b.remove(); }
      else {
        if (!b){ b = el('span', { class:'nav-count alert boss-badge' }); side.insertBefore(b, side.querySelector('.nav-count')); }
        b.textContent = '+' + n;
        b.title = 'New from ' + displayName('partner');
      }
    }
  }

  const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtClock(){
    const t = istShift();
    let h = t.getUTCHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return t.getUTCDate() + ' ' + MONTHS_S[t.getUTCMonth()] + ', ' + t.getUTCFullYear()
         + ' - ' + h + ':' + pad2(t.getUTCMinutes()) + ' ' + ap;
  }
  function startClock(){
    const n = $('#footClock');
    if (!n) return;
    const upd = () => { n.textContent = fmtClock(); };
    upd();
    setInterval(upd, 15000);
  }

  function updateLockBtn(){
    const b = $('#lockBtn');
    if (b) b.classList.toggle('hidden', !(typeof Lock !== 'undefined' && Lock.enabled()));
  }

  function setSync(state, label){
    const dot = $('#syncDot'), lab = $('#syncLabel');
    if (dot) dot.setAttribute('data-s', state);
    if (lab) lab.textContent = label;
  }

  /* counts in sidebar are filled by later phases via this hook */
  function setCounts(map){
    $$('#sideViews [data-count]').forEach(n => {
      const v = map[n.getAttribute('data-count')];
      n.textContent = (v == null || v === 0) ? '' : v;
      n.classList.toggle('alert', n.getAttribute('data-count') === 'today' && !!(map._overdue));
    });
  }
  function setCatCounts(map){
    $$('#sideCats [data-catcount]').forEach(n => {
      const v = map[n.getAttribute('data-catcount')];
      n.textContent = (v == null || v === 0) ? '' : v;
    });
  }

  function init(){
    buildSidebar();
    buildBottomNav();
    renderIdentityChip();
    bindHeader();
    $('#brandVer').textContent = 'v' + APP.version;
    startClock();
    updateLockBtn();
    Store.onChange(what => {
      if (what === 'cats' || what === 'all'){
        buildCats();
        if (typeof refreshCounts === 'function') refreshCounts();
      }
      if (what === 'identity' || what === 'all') renderIdentityChip();
      if (what === 'settings' || what === 'all'){ Theme.apply(); updateLockBtn(); }
    });
  }

  return {
    init:init, syncNavActive:syncNavActive, setSync:setSync,
    setCounts:setCounts, setCatCounts:setCatCounts,
    buildCats:buildCats, renderIdentityChip:renderIdentityChip,
    openQuickAdd:openQuickAdd, setBossBadge:setBossBadge
  };
})();
