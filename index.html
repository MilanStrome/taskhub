/* ------------------------------------------------------------
   10b. LOCK - password lock screen (per-device, NEVER synced)
   Stores only a SHA-256 hash. Session-unlocked until tab closes.
   ------------------------------------------------------------ */
const Lock = (function(){
  const SKEY = APP.ns + '.unlocked';   /* sessionStorage flag - dies with the tab */
  let memFlag = false;                 /* fallback if sessionStorage unavailable */
  let lastActivity = Date.now();
  let onUnlockCb = null;

  /* --- SHA-256 (hex). Native WebCrypto first; pure-JS fallback for
         contexts without crypto.subtle (plain http, odd webviews). --- */
  const SHA_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function sha256Fallback(input){
    const msg = unescape(encodeURIComponent(input));   /* UTF-8 bytes as chars */
    const rr = (v, n) => (v >>> n) | (v << (32 - n));
    let H0=0x6a09e667,H1=0xbb67ae85,H2=0x3c6ef372,H3=0xa54ff53a,
        H4=0x510e527f,H5=0x9b05688c,H6=0x1f83d9ab,H7=0x5be0cd19;
    const bitLen = msg.length * 8;
    let p = msg + String.fromCharCode(0x80);
    while (p.length % 64 !== 56) p += String.fromCharCode(0);
    const hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
    [24,16,8,0].forEach(sh => { p += String.fromCharCode((hi >>> sh) & 0xff); });
    [24,16,8,0].forEach(sh => { p += String.fromCharCode((lo >>> sh) & 0xff); });
    const w = new Array(64);
    for (let i = 0; i < p.length; i += 64){
      for (let j = 0; j < 16; j++){
        const o = i + j * 4;
        w[j] = (p.charCodeAt(o) << 24) | (p.charCodeAt(o+1) << 16) | (p.charCodeAt(o+2) << 8) | p.charCodeAt(o+3);
      }
      for (let j = 16; j < 64; j++){
        const s0 = rr(w[j-15],7) ^ rr(w[j-15],18) ^ (w[j-15] >>> 3);
        const s1 = rr(w[j-2],17) ^ rr(w[j-2],19) ^ (w[j-2] >>> 10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
      }
      let a=H0,b=H1,c=H2,d=H3,e=H4,f=H5,g=H6,h=H7;
      for (let j = 0; j < 64; j++){
        const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + SHA_K[j] + w[j]) | 0;
        const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H0=(H0+a)|0; H1=(H1+b)|0; H2=(H2+c)|0; H3=(H3+d)|0;
      H4=(H4+e)|0; H5=(H5+f)|0; H6=(H6+g)|0; H7=(H7+h)|0;
    }
    return [H0,H1,H2,H3,H4,H5,H6,H7]
      .map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
  }

  async function sha256Hex(str){
    try{
      if (window.crypto && crypto.subtle && window.TextEncoder){
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        let out = '';
        new Uint8Array(buf).forEach(b => { out += (b < 16 ? '0' : '') + b.toString(16); });
        return out;
      }
    }catch(e){ /* fall through to JS implementation */ }
    return sha256Fallback(str);
  }

  /* --- state --- */
  function enabled(){ return !!Store.get('lockHash'); }
  function sessionUnlocked(){
    try{ return sessionStorage.getItem(SKEY) === '1'; }catch(e){ return memFlag; }
  }
  function setUnlocked(v){
    memFlag = v;
    try{ if (v) sessionStorage.setItem(SKEY, '1'); else sessionStorage.removeItem(SKEY); }catch(e){}
  }
  function required(){ return enabled() && !sessionUnlocked(); }
  async function verify(pw){ return (await sha256Hex(pw)) === Store.get('lockHash'); }

  /* --- overlay --- */
  function show(cb){
    onUnlockCb = cb || null;
    $('#identityScreen').classList.add('hidden');
    $('#app').classList.add('hidden');
    $('#lockScreen').classList.remove('hidden');
    $('#lockErr').textContent = '';
    const inp = $('#lockInput');
    inp.value = '';
    setTimeout(() => inp.focus(), 60);
  }

  async function tryUnlock(){
    const inp = $('#lockInput');
    if (!inp.value) return;
    if (await verify(inp.value)){
      setUnlocked(true);
      lastActivity = Date.now();
      $('#lockScreen').classList.add('hidden');
      const cb = onUnlockCb; onUnlockCb = null;
      if (cb) cb();
    } else {
      const card = $('#lockScreen .lock-card');
      card.classList.remove('shake');
      void card.offsetWidth;                       /* restart animation */
      card.classList.add('shake');
      $('#lockErr').textContent = 'Wrong password.';
      inp.value = '';
      inp.focus();
    }
  }

  function lockNow(){
    if (!enabled()) return;
    setUnlocked(false);
    show(() => { $('#app').classList.remove('hidden'); });
  }

  /* --- auto-lock after inactivity --- */
  function noteActivity(){ lastActivity = Date.now(); }
  function autoLockTick(){
    const min = +Store.get('autoLockMin') || 0;
    if (!min || !enabled()) return;
    if (!$('#lockScreen').classList.contains('hidden')) return;   /* already locked */
    if (Date.now() - lastActivity >= min * 60000) lockNow();
  }

  /* --- password dialogs --- */
  function pwInput(placeholder, current){
    const i = el('input', { class:'inp', type:'password', placeholder:placeholder });
    i.setAttribute('autocomplete', current ? 'current-password' : 'new-password');
    return i;
  }

  function dlg(title, fields, onSubmit){
    const body = el('div', { style:{ display:'flex', flexDirection:'column', gap:'12px' } });
    fields.forEach(f => body.appendChild(fieldWrap(f[0], f[1])));
    const err = el('div', { class:'lock-err' });
    body.appendChild(err);
    const foot = el('div', { style:{ display:'flex', gap:'8px' } });
    const go = async () => {
      err.textContent = '';
      const msg = await onSubmit();
      if (msg){ err.textContent = msg; return; }
      Modal.close(inst);
    };
    fields.forEach(f => f[1].addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } }));
    foot.appendChild(el('button', { class:'btn btn-outline', text:'Cancel', onclick: () => Modal.close(inst) }));
    foot.appendChild(el('button', { class:'btn btn-primary', text:'Save', onclick:go }));
    const inst = Modal.open({ title:title, body:body, footer:foot });
  }

  function setupDialog(){
    const p1 = pwInput('New password'), p2 = pwInput('Repeat password');
    dlg('Set password', [['Password', p1], ['Repeat', p2]], async () => {
      if (p1.value.length < 4) return 'At least 4 characters.';
      if (p1.value !== p2.value) return 'Passwords do not match.';
      Store.set('lockHash', await sha256Hex(p1.value));
      setUnlocked(true);
      Toast.show('Password set - this device now locks on open.');
      Router.render();
      return null;
    });
  }

  function changeDialog(){
    const p0 = pwInput('Current password', true), p1 = pwInput('New password'), p2 = pwInput('Repeat new password');
    dlg('Change password', [['Current', p0], ['New', p1], ['Repeat', p2]], async () => {
      if (!(await verify(p0.value))) return 'Current password is wrong.';
      if (p1.value.length < 4) return 'At least 4 characters.';
      if (p1.value !== p2.value) return 'Passwords do not match.';
      Store.set('lockHash', await sha256Hex(p1.value));
      Toast.show('Password changed.');
      return null;
    });
  }

  function removeDialog(){
    const p0 = pwInput('Current password', true);
    dlg('Remove password', [['Current password', p0]], async () => {
      if (!(await verify(p0.value))) return 'Current password is wrong.';
      Store.set('lockHash', null);
      setUnlocked(false);
      Toast.show('Password removed.');
      Router.render();
      return null;
    });
  }

  /* --- settings panel (rendered by Views.settings) --- */
  function settingsPanel(){
    const p = el('div', { class:'panel', style:{ marginBottom:'16px' } });
    p.appendChild(el('div', { class:'side-group-label', style:{ padding:'0 0 10px' }, text:'Security' }));
    if (!enabled()){
      const row = el('div', { class:'row-line' });
      row.appendChild(el('div', { class:'rl-main' }, [
        el('div', { class:'rl-title', text:'Password lock' }),
        el('div', { class:'rl-desc', text:'Protect this device with a password. Local only - never synced.' })
      ]));
      row.appendChild(el('button', { class:'btn btn-sm', text:'Set password', onclick:setupDialog }));
      p.appendChild(row);
    } else {
      const row = el('div', { class:'row-line' });
      row.appendChild(el('div', { class:'rl-main' }, [
        el('div', { class:'rl-title', text:'Password lock - on' }),
        el('div', { class:'rl-desc', text:'Only a SHA-256 hash is stored, on this device only. Unlocked until the tab closes.' })
      ]));
      row.appendChild(el('button', { class:'btn btn-sm', text:'Lock now', onclick:lockNow }));
      p.appendChild(row);

      const row2 = el('div', { class:'row-line' });
      row2.appendChild(el('div', { class:'rl-main' }, [ el('div', { class:'rl-title', text:'Manage' }) ]));
      row2.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'Change password', onclick:changeDialog }));
      row2.appendChild(el('button', { class:'btn btn-danger btn-sm', text:'Remove', onclick:removeDialog }));
      p.appendChild(row2);

      p.appendChild(segRow('Auto-lock', 'Lock after inactivity on this device', [
        { id:'0', label:'Off' }, { id:'5', label:'5 min' }, { id:'15', label:'15 min' }, { id:'30', label:'30 min' }
      ], String(Store.get('autoLockMin') || 0), v => { Store.set('autoLockMin', +v); Router.render(); }));
    }
    return p;
  }

  function init(){
    $('#lockForm').addEventListener('submit', e => { e.preventDefault(); tryUnlock(); });
    ['pointerdown','keydown','touchstart'].forEach(ev =>
      document.addEventListener(ev, noteActivity, { passive:true }));
    setInterval(autoLockTick, 15000);
  }

  return { init:init, enabled:enabled, required:required, show:show, lockNow:lockNow,
           settingsPanel:settingsPanel, sha256Hex:sha256Hex, _fallback:sha256Fallback };
})();

/* small helper used by settings rows */
function segRow(title, desc, options, value, onPick){
  const row = el('div', { class:'row-line' });
  row.appendChild(el('div', { class:'rl-main' }, [
    el('div', { class:'rl-title', text:title }),
    desc ? el('div', { class:'rl-desc', text:desc }) : null
  ]));
  const seg = el('div', { class:'seg' });
  const btns = [];
  const set = v => btns.forEach(b => b.classList.toggle('on', b.getAttribute('data-val') === v));
  options.forEach(o => {
    const b = el('button', {
      type:'button', 'data-val':o.id, text:o.label,
      onclick: () => { set(o.id); onPick(o.id); }   /* highlight moves immediately, then save */
    });
    btns.push(b);
    seg.appendChild(b);
  });
  set(value);
  row.appendChild(seg);
  return row;
}

function switchRow(title, desc, checked, onToggle){
  const row = el('div', { class:'row-line' });
  row.appendChild(el('div', { class:'rl-main' }, [
    el('div', { class:'rl-title', text:title }),
    desc ? el('div', { class:'rl-desc', text:desc }) : null
  ]));
  const sw = el('label', { class:'switch' });
  const inp = el('input', { type:'checkbox' });
  inp.checked = !!checked;
  inp.addEventListener('change', () => onToggle(inp.checked));
  sw.appendChild(inp);
  sw.appendChild(el('span', { class:'track' }));
  sw.appendChild(el('span', { class:'knob' }));
  row.appendChild(sw);
  return row;
}

/* ------------------------------------------------------------
   P2. TASK ENGINE - model, CRUD, queries  (Phase 2)
   ------------------------------------------------------------ */
const PRI_ORDER = { high:0, medium:1, low:2 };

const Tasks = (function(){

  function blank(fields){
    const now = nowISO();
    const me = Store.identity() || 'Manan';
    return Object.assign({
      id: uid('tsk'),
      title:'', notes:'',
      status:'todo',
      priority: Store.get('defaultPriority') || 'medium',
      category: Store.generalCatId(),
      dueDate:null,
      assignedBy: me, createdBy: me,
      pinned:false, personal:false,
      recurrence:null,
      subtasks:[], links:[], attachments:[], comments:[],
      activity:[],
      createdAt:now, updatedAt:now, completedAt:null,
      deleted:false
    }, fields || {});
  }

  function log(t, action, detail){
    t.activity.push({ at:nowISO(), who:Store.identity() || '?', action:action, detail:detail || '' });
  }

  function enforcePersonal(t){
    const cat = Store.getCat(t.category);
    if (cat && cat.personalOnly) t.personal = true;
  }

  function queueSync(t){
    if (t.personal) return;                    /* HARD RULE: personal never syncs */
    const q = Store.metaGet('pendingSync');
    if (q.indexOf(t.id) === -1){ q.push(t.id); Store.saveMeta(); }
  }

  function commit(t){
    t.updatedAt = nowISO();
    Store.saveTasks();
    queueSync(t);
    Store.emit('tasks');
  }

  function create(fields){
    const t = blank(fields);
    t.title = (t.title || '').trim();
    if (!t.title) return null;
    enforcePersonal(t);
    log(t, 'created', '');
    Store.tasks().push(t);
    commit(t);
    return t;
  }

  function update(id, patch, detail){
    const t = Store.getTask(id); if (!t) return null;
    Object.assign(t, patch);
    enforcePersonal(t);
    log(t, 'edited', detail || Object.keys(patch).join(', '));
    commit(t);
    return t;
  }

  function setStatus(id, status){
    if (status === 'done'){ complete(id); return Store.getTask(id); }
    const t = Store.getTask(id); if (!t || t.status === status) return t;
    const from = t.status;
    t.status = status;
    t.completedAt = null;
    log(t, 'status_changed', from + ' → ' + status);
    commit(t);
    return t;
  }

  function softDelete(id){
    const t = Store.getTask(id); if (!t) return null;
    t.deleted = true;
    log(t, 'edited', 'deleted');
    commit(t);
    return t;
  }

  function unDelete(id){
    const t = Store.getTask(id); if (!t) return null;
    t.deleted = false;
    log(t, 'edited', 'restored');
    commit(t);
    return t;
  }

  function addComment(id, text){
    const t = Store.getTask(id); if (!t) return null;
    text = String(text || '').trim();
    if (!text) return null;
    t.comments.push({ id:uid('cm'), author:Store.identity() || '?', text:text, at:nowISO() });
    log(t, 'commented', text.slice(0, 80));
    commit(t);
    return t;
  }

  function reassignCategory(fromId, toId){
    let n = 0;
    Store.tasks().forEach(t => {
      if (t.category === fromId){
        t.category = toId;
        t.updatedAt = nowISO();
        queueSync(t);
        n++;
      }
    });
    if (n){ Store.saveTasks(); Store.emit('tasks'); }
    return n;
  }

  /* ---- recurrence ---- */
  function addMonthsKey(key, n){
    const p = parseDateKey(key); if (!p) return key;
    const total = p.m - 1 + n;
    const y = p.y + Math.floor(total / 12);
    const m = ((total % 12) + 12) % 12;
    const lastDay = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return y + '-' + pad2(m + 1) + '-' + pad2(Math.min(p.d, lastDay));
  }

  function nextDueFor(t){
    const r = t.recurrence;
    if (!r || !r.type) return null;
    const base = t.dueDate || todayKey();
    const n = clamp((+r.interval) || 1, 1, 99);
    if (r.type === 'daily') return addDaysKey(base, n);
    if (r.type === 'weekly') return addDaysKey(base, 7 * n);
    if (r.type === 'monthly') return addMonthsKey(base, n);
    return null;
  }

  function spawnNext(t){
    const now = nowISO();
    const next = {
      id: uid('tsk'),
      title: t.title, notes: t.notes,
      status: 'todo',
      priority: t.priority, category: t.category,
      dueDate: nextDueFor(t),
      assignedBy: t.assignedBy,
      createdBy: Store.identity() || t.createdBy,
      pinned: t.pinned, personal: t.personal,
      recurrence: clone(t.recurrence),
      subtasks: (t.subtasks || []).map(x => ({ id: uid('st'), text: x.text, done: false })),
      links: clone(t.links || []),
      attachments: [], comments: [], activity: [],
      createdAt: now, updatedAt: now, completedAt: null,
      deleted: false
    };
    log(next, 'created', 'recurring - next instance');
    Store.tasks().push(next);
    queueSync(next);
    return next;
  }

  /* the ONLY path to done - spawns the next recurring instance */
  function complete(id){
    const t = Store.getTask(id); if (!t || t.status === 'done') return null;
    const from = t.status;
    t.status = 'done';
    t.completedAt = nowISO();
    log(t, 'status_changed', from + ' \u2192 done');
    let next = null;
    if (t.recurrence && t.recurrence.type) next = spawnNext(t);
    commit(t);
    return next;
  }

  /* ---- snooze (respects working days) ---- */
  function nextWorkingDay(key){
    const wd = Store.get('workingDays');
    if (!Array.isArray(wd) || !wd.some(Boolean)) return key;
    let k = key, guard = 0;
    while (!wd[weekdayOfKey(k)] && guard++ < 7) k = addDaysKey(k, 1);
    return k;
  }

  function snooze(id, dateKey){
    const t = Store.getTask(id); if (!t) return null;
    t.dueDate = dateKey;
    log(t, 'snoozed', 'to ' + fmtDate(dateKey));
    commit(t);
    return t;
  }

  /* ---- pin / duplicate ---- */
  function togglePin(id){
    const t = Store.getTask(id); if (!t) return null;
    t.pinned = !t.pinned;
    log(t, 'edited', t.pinned ? 'pinned' : 'unpinned');
    commit(t);
    return t;
  }

  function duplicate(id){
    const t = Store.getTask(id); if (!t) return null;
    const now = nowISO();
    const copy = clone(t);
    copy.id = uid('tsk');
    copy.title = t.title + ' (copy)';
    copy.comments = [];
    copy.activity = [];
    copy.completedAt = null;
    if (copy.status === 'done') copy.status = 'todo';
    copy.subtasks = (t.subtasks || []).map(x => ({ id: uid('st'), text: x.text, done: x.done }));
    copy.createdAt = now; copy.updatedAt = now;
    copy.createdBy = Store.identity() || copy.createdBy;
    log(copy, 'created', 'duplicated');
    Store.tasks().push(copy);
    commit(copy);
    return copy;
  }

  /* ---- subtasks ---- */
  function addSubtask(id, text){
    const t = Store.getTask(id); if (!t) return null;
    text = String(text || '').trim(); if (!text) return null;
    t.subtasks.push({ id: uid('st'), text: text, done: false });
    log(t, 'edited', 'subtask added: ' + text.slice(0, 40));
    commit(t); return t;
  }
  function toggleSubtask(id, stId){
    const t = Store.getTask(id); if (!t) return null;
    const x = t.subtasks.find(v => v.id === stId); if (!x) return null;
    x.done = !x.done;
    commit(t); return t;
  }
  function removeSubtask(id, stId){
    const t = Store.getTask(id); if (!t) return null;
    const i = t.subtasks.findIndex(v => v.id === stId); if (i === -1) return null;
    log(t, 'edited', 'subtask removed: ' + t.subtasks[i].text.slice(0, 40));
    t.subtasks.splice(i, 1);
    commit(t); return t;
  }
  function moveSubtask(id, stId, dir){
    const t = Store.getTask(id); if (!t) return null;
    const i = t.subtasks.findIndex(v => v.id === stId);
    const j = i + dir;
    if (i === -1 || j < 0 || j >= t.subtasks.length) return null;
    const tmp = t.subtasks[i]; t.subtasks[i] = t.subtasks[j]; t.subtasks[j] = tmp;
    commit(t); return t;
  }

  /* ---- links ---- */
  function addLink(id, label, url){
    const t = Store.getTask(id); if (!t) return null;
    url = String(url || '').trim(); if (!url) return null;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    label = String(label || '').trim() || url.replace(/^https?:\/\//i, '').split('/')[0];
    t.links.push({ label: label, url: url });
    log(t, 'edited', 'link added: ' + label.slice(0, 40));
    commit(t); return t;
  }
  function removeLink(id, idx){
    const t = Store.getTask(id); if (!t || !t.links[idx]) return null;
    log(t, 'edited', 'link removed: ' + String(t.links[idx].label).slice(0, 40));
    t.links.splice(idx, 1);
    commit(t); return t;
  }

  /* ---- attachments ---- */
  function addAttachment(id, att){
    const t = Store.getTask(id); if (!t) return null;
    t.attachments.push(att);
    log(t, 'attached', att.name);
    commit(t);
    return t;
  }
  function finishAttachment(id, attId, driveUrl, thumbUrl){
    const t = Store.getTask(id); if (!t) return null;
    const a = (t.attachments || []).find(x => x.id === attId);
    if (!a) return null;
    a.driveUrl = driveUrl;
    a.thumbUrl = thumbUrl || null;
    delete a.pending;
    commit(t);
    return t;
  }
  function removeAttachment(id, attId){
    const t = Store.getTask(id); if (!t) return null;
    const i = (t.attachments || []).findIndex(x => x.id === attId);
    if (i === -1) return null;
    log(t, 'edited', 'attachment removed: ' + String(t.attachments[i].name).slice(0, 40));
    t.attachments.splice(i, 1);
    commit(t);
    return t;
  }

  /* ---- undo support ---- */
  function snapshot(id){
    const t = Store.getTask(id);
    return t ? clone(t) : null;
  }
  function restoreSnapshot(snap){
    if (!snap) return;
    const i = Store.tasks().findIndex(x => x.id === snap.id);
    const restored = clone(snap);
    restored.updatedAt = nowISO();      /* newer-wins merge must pick the undo */
    if (i === -1) Store.tasks().push(restored);
    else Store.tasks()[i] = restored;
    Store.saveTasks();
    queueSync(restored);
    Store.emit('tasks');
  }
  /* remove a just-spawned recurring instance on undo:
     hard-remove if it never left this device, soft-delete otherwise */
  function retractSpawn(id){
    const i = Store.tasks().findIndex(x => x.id === id);
    if (i === -1) return;
    const q = Store.metaGet('pendingSync');
    const qi = q.indexOf(id);
    if (qi !== -1 || Store.tasks()[i].personal){
      if (qi !== -1){ q.splice(qi, 1); Store.saveMeta(); }
      Store.tasks().splice(i, 1);
      Store.saveTasks();
      Store.emit('tasks');
    } else {
      softDelete(id);
    }
  }

  /* ---- queries ---- */
  function all(){ return Store.tasks().filter(t => !t.deleted); }
  function open(){ return all().filter(t => t.status !== 'done'); }
  function daysLate(t){ return t.dueDate ? dayDiff(t.dueDate, todayKey()) : 0; }
  function isOverdue(t){ return t.status !== 'done' && !!t.dueDate && daysLate(t) > 0; }
  function isDueToday(t){ return t.status !== 'done' && t.dueDate === todayKey(); }
  function fromOther(t){ return !!t.assignedBy && t.assignedBy !== Store.identity(); }
  function ageDays(t){ return Math.floor((Date.now() - new Date(t.createdAt).getTime()) / 86400000); }
  /* auto-clear: done older than settings.autoClearDays leaves main views (archive keeps it) */
  function isArchived(t){
    const days = +Store.get('autoClearDays') || 0;
    if (!days || t.status !== 'done' || !t.completedAt) return false;
    return dayDiff(istDateKey(new Date(t.completedAt)), todayKey()) > days;
  }

  function cmp(sort){
    return function(a, b){
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;          /* pinned float to top */
      const ad = a.status === 'done', bd = b.status === 'done';
      if (ad !== bd) return ad ? 1 : -1;                            /* done sinks */
      if (sort === 'priority'){
        const d = PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
        if (d) return d;
      } else if (sort === 'created'){
        return new Date(b.createdAt) - new Date(a.createdAt);
      } else if (sort === 'updated'){
        return new Date(b.updatedAt) - new Date(a.updatedAt);
      } else { /* due (default) - dated first, soonest first */
        if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
        if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
      }
      const d2 = PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
      if (d2) return d2;
      return new Date(b.createdAt) - new Date(a.createdAt);
    };
  }

  /* purge soft-deleted rows older than 30 days (spec §3) */
  function init(){
    const cutoff = Date.now() - 30 * 86400000;
    const keep = Store.tasks().filter(t => !(t.deleted && new Date(t.updatedAt).getTime() < cutoff));
    if (keep.length !== Store.tasks().length) Store.setTasks(keep, { silent:true });
  }

  return { create:create, update:update, setStatus:setStatus, softDelete:softDelete,
           unDelete:unDelete, addComment:addComment, reassignCategory:reassignCategory,
           complete:complete, snooze:snooze, nextWorkingDay:nextWorkingDay,
           togglePin:togglePin, duplicate:duplicate,
           addSubtask:addSubtask, toggleSubtask:toggleSubtask, removeSubtask:removeSubtask, moveSubtask:moveSubtask,
           addLink:addLink, removeLink:removeLink,
           addAttachment:addAttachment, finishAttachment:finishAttachment, removeAttachment:removeAttachment,
           snapshot:snapshot, restoreSnapshot:restoreSnapshot, retractSpawn:retractSpawn,
           all:all, open:open, isOverdue:isOverdue, isDueToday:isDueToday,
           fromOther:fromOther, daysLate:daysLate, ageDays:ageDays, isArchived:isArchived, cmp:cmp, init:init };
})();

/* ------------------------------------------------------------
   P2b. SHARED FORM HELPERS
   ------------------------------------------------------------ */
function fieldWrap(label, node){
  return el('div', { class:'field' }, [ el('label', { text:label }), node ]);
}

function segPick(options, value, onPick){
  const seg = el('div', { class:'seg' });
  const btns = {};
  options.forEach(o => {
    const b = el('button', { type:'button', text:o.label, onclick: () => { set(o.id); onPick(o.id); } });
    btns[o.id] = b;
    seg.appendChild(b);
  });
  function set(v){ for (const k in btns) btns[k].classList.toggle('on', k === v); }
  set(value);
  seg._set = set;
  return seg;
}

function catSelect(value, onChange){
  const s = el('select', { class:'sel', 'aria-label':'Category' });
  Store.cats().forEach(c => s.appendChild(el('option', { value:c.id, text:c.name })));
  s.value = value || Store.generalCatId();
  if (onChange) s.addEventListener('change', () => onChange(s.value));
  return s;
}

function miniSel(aria, opts, value, onChange){
  const s = el('select', { class:'sel', 'aria-label':aria || 'Select' });
  opts.forEach(o => s.appendChild(el('option', { value:o[0], text:o[1] })));
  s.value = value;
  s.addEventListener('change', () => onChange(s.value));
  return s;
}

function groupHead(label, n, color){
  const dot = el('span', { class:'cat-dot' });
  dot.style.background = color;
  return el('div', { class:'grp-head' }, [ dot, label, el('span', { class:'tsec-count', text:n }) ]);
}

/* ------------------------------------------------------------
   P2c. TASK UI - cards, quick add, detail modal
   ------------------------------------------------------------ */
const TaskUI = (function(){

  function chip(cls, text, title){
    return el('span', { class:'tc-chip' + (cls ? ' ' + cls : ''), text:text, title:title || null });
  }

  function dueChipFor(t){
    if (!t.dueDate) return null;
    if (t.status === 'done') return chip('', fmtDateShort(t.dueDate), 'Due date');
    const late = Tasks.daysLate(t);
    if (late >= 3) return chip('od3', fmtDateShort(t.dueDate) + ' · ' + late + 'd late', 'Overdue');
    if (late >= 1) return chip('od1', fmtDateShort(t.dueDate) + ' · ' + late + 'd late', 'Overdue');
    if (late === 0) return chip('due-today', 'Today', 'Due today');
    if (late === -1) return chip('', 'Tomorrow', 'Due tomorrow');
    return chip('', fmtDateShort(t.dueDate), 'Due ' + fmtDate(t.dueDate));
  }

  let _swipeGuard = 0;

  /* swipe right = done, swipe left = snooze (touch devices, list views) */
  function attachSwipe(wrap, cardEl, t){
    let sx = 0, sy = 0, dx = 0, active = false, horiz = false;
    cardEl.addEventListener('touchstart', e => {
      const pt = e.touches[0];
      sx = pt.clientX; sy = pt.clientY; dx = 0; active = true; horiz = false;
      cardEl.style.transition = 'none';
    }, { passive:true });
    cardEl.addEventListener('touchmove', e => {
      if (!active) return;
      const pt = e.touches[0];
      dx = pt.clientX - sx;
      const dy = pt.clientY - sy;
      if (!horiz){
        if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) horiz = true;
        else if (Math.abs(dy) > 14){ active = false; return; }
        else return;
      }
      if (t.status === 'done' && dx > 0) dx = 0;    /* can't complete twice */
      cardEl.style.transform = 'translateX(' + dx + 'px)';
      wrap.classList.toggle('sw-r', dx > 30);
      wrap.classList.toggle('sw-l', dx < -30);
    }, { passive:true });
    const finish = () => {
      if (!active) return;
      active = false;
      cardEl.style.transition = 'transform 180ms ease';
      const overR = horiz && dx > 80 && t.status !== 'done';
      const overL = horiz && dx < -80;
      if (horiz) _swipeGuard = Date.now();
      if (overR){
        cardEl.style.transform = 'translateX(110%)';
        setTimeout(() => doneWithUndo(t.id), 150);
      } else {
        cardEl.style.transform = '';
        wrap.classList.remove('sw-r', 'sw-l');
        if (overL) snoozeMenu(t.id);
      }
    };
    cardEl.addEventListener('touchend', finish);
    cardEl.addEventListener('touchcancel', finish);
  }

  function card(t, opts){
    opts = opts || {};
    const pri = PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1];
    const open = opts.onClick || (() => openDetail(t.id));
    const c = el('div', {
      class:'tcard' + (t.status === 'done' ? ' done' : ''),
      tabindex:'0', 'data-id':t.id, role:'button',
      onclick: () => { if (Date.now() - _swipeGuard < 400) return; open(); },
      onkeydown: e => { if (e.key === 'Enter' && e.target === c){ e.preventDefault(); open(); } }
    });
    c.style.setProperty('--pbar', pri.color);
    if (opts.draggable){
      c.setAttribute('draggable', 'true');
      c.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', t.id);
        e.dataTransfer.effectAllowed = 'move';
        c.classList.add('dragging');
      });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
    }

    c.appendChild(el('button', {
      class:'tc-check', 'aria-label': t.status === 'done' ? 'Reopen task' : 'Mark done',
      html:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5L9.6 17 4 11.6"/></svg>',
      onclick: e => { e.stopPropagation(); toggleDone(t.id); }
    }));

    const main = el('div', { class:'tc-main' });
    main.appendChild(el('div', { class:'tc-title', text:(t.pinned ? '📌 ' : '') + t.title }));

    const meta = el('div', { class:'tc-meta' });
    const dch = dueChipFor(t); if (dch) meta.appendChild(dch);

    meta.appendChild(el('span', { class:'tc-cat' }, [
      el('span', { class:'cat-dot', style:{ background: Store.catColor(t.category) } }),
      Store.catName(t.category)
    ]));

    if (t.subtasks && t.subtasks.length){
      const done = t.subtasks.filter(s => s.done).length;
      meta.appendChild(el('span', { class:'tc-prog-wrap', title:'Subtasks' }, [
        el('span', { class:'tc-prog' }, [
          el('span', { class:'tc-prog-fill', style:{ width: Math.round(done / t.subtasks.length * 100) + '%' } })
        ]),
        done + '/' + t.subtasks.length
      ]));
    }
    if (t.attachments && t.attachments.length) meta.appendChild(el('span', { text:'📎 ' + t.attachments.length, title:'Attachments' }));
    if (t.comments && t.comments.length) meta.appendChild(el('span', { text:'💬 ' + t.comments.length, title:'Comments' }));
    if (t.personal) meta.appendChild(el('span', { text:'🔒', title:'Personal - never synced' }));
    if (Tasks.fromOther(t)) meta.appendChild(el('span', { class:'tc-badge', text:'From ' + displayName(t.assignedBy) }));
    if (t.status === 'todo' && Tasks.ageDays(t) >= 7) meta.appendChild(el('span', { class:'tc-age', text:'created ' + Tasks.ageDays(t) + 'd ago' }));

    main.appendChild(meta);
    c.appendChild(main);
    if (opts.rightNode){
      c.appendChild(opts.rightNode(t));
    } else {
      c.appendChild(el('span', { class:'tc-pri', text:pri.label, style:{ color:pri.color } }));
    }

    if (opts.noSwipe) return c;

    const wrap = el('div', { class:'swipe-wrap' });
    wrap.appendChild(el('div', { class:'swipe-bg' }, [
      el('span', { text:'✓ Done' }),
      el('span', { text:'💤 Snooze' })
    ]));
    wrap.appendChild(c);
    attachSwipe(wrap, c, t);
    return wrap;
  }

  function toggleDone(id){
    const t = Store.getTask(id); if (!t) return;
    if (t.status === 'done'){
      Tasks.setStatus(id, 'todo');
      Toast.show('Task reopened.');
    } else {
      doneWithUndo(id);
    }
  }

  /* mark done with 5s undo - retracts a spawned recurring instance too */
  function doneWithUndo(id){
    const t = Store.getTask(id); if (!t || t.status === 'done') return;
    const snap = Tasks.snapshot(id);
    const next = Tasks.complete(id);
    const msg = 'Done: ' + t.title + (next && next.dueDate ? ' · next on ' + fmtDate(next.dueDate) : '');
    Toast.show(msg, {
      actionLabel:'Undo', duration:5000,
      action: () => {
        if (next) Tasks.retractSpawn(next.id);
        Tasks.restoreSnapshot(snap);
      }
    });
  }

  function deleteWithUndo(id){
    const snap = Tasks.snapshot(id); if (!snap) return;
    Tasks.softDelete(id);
    Toast.show('Task deleted.', {
      actionLabel:'Undo', duration:5000,
      action: () => Tasks.restoreSnapshot(snap)
    });
  }

  /* snooze menu: Tomorrow / Next week / Pick date - respects working days */
  function snoozeMenu(id){
    const t = Store.getTask(id); if (!t) return;
    const tmw = Tasks.nextWorkingDay(addDaysKey(todayKey(), 1));
    const nwk = Tasks.nextWorkingDay(addDaysKey(todayKey(), 7));
    const apply = (key) => {
      const snap = Tasks.snapshot(id);
      Tasks.snooze(id, key);
      Modal.close(inst);
      Toast.show('Snoozed to ' + fmtDate(key) + '.', {
        actionLabel:'Undo', duration:5000,
        action: () => Tasks.restoreSnapshot(snap)
      });
    };
    const body = el('div', { style:{ display:'flex', flexDirection:'column', gap:'10px' } });
    body.appendChild(el('button', { class:'btn btn-block',
      text:'Tomorrow · ' + WEEKDAYS[weekdayOfKey(tmw)] + ' ' + fmtDateShort(tmw),
      onclick: () => apply(tmw) }));
    body.appendChild(el('button', { class:'btn btn-block',
      text:'Next week · ' + WEEKDAYS[weekdayOfKey(nwk)] + ' ' + fmtDateShort(nwk),
      onclick: () => apply(nwk) }));
    const row = el('div', { style:{ display:'flex', gap:'8px' } });
    const dt = el('input', { class:'inp', type:'date', 'aria-label':'Snooze date' });
    row.appendChild(dt);
    row.appendChild(el('button', { class:'btn btn-primary', text:'Snooze', onclick: () => { if (dt.value) apply(dt.value); } }));
    body.appendChild(row);
    const inst = Modal.open({ title:'Snooze “' + t.title.slice(0, 40) + '”', body:body });
  }

  function list(tasks, opts){
    const wrap = el('div', { class:'tlist' });
    tasks.forEach(t => wrap.appendChild(card(t, opts)));
    return wrap;
  }

  function emptyState(o){
    o = o || {};
    return el('div', { class:'empty' }, [
      el('div', { class:'e-ico', text:o.icon || '🗒' }),
      el('div', { class:'e-title', text:o.title || 'Nothing here' }),
      el('div', { class:'e-text', text:o.text || 'Add a task to get moving.' }),
      el('div', { class:'e-bar' })
    ]);
  }

  /* ---- quick add bar (top of Today / All) ---- */
  function quickAddBar(){
    const wrap = el('div', { class:'qadd' });
    const input = el('input', { id:'qaddInput', placeholder:'Add a task - Enter saves', 'aria-label':'Quick add task', autocomplete:'off' });
    const save = () => {
      const v = input.value.trim();
      if (!v) return;
      refocus('#qaddInput');
      Tasks.create({ title:v });
      Toast.show('Task added.');
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); save(); } });
    wrap.appendChild(input);
    wrap.appendChild(el('button', {
      class:'icon-btn', title:'Paste import', 'aria-label':'Paste import',
      html:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="4" rx="1.5"/><path d="M17 5.5h2a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 20V7A1.5 1.5 0 0 1 5 5.5h2M8 12h8M8 16h5"/></svg>',
      onclick: () => PasteImport.open()
    }));
    wrap.appendChild(el('button', {
      class:'icon-btn', title:'More options', 'aria-label':'Open full form',
      html:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
      onclick: () => quickAdd(input.value.trim())
    }));
    wrap.appendChild(el('button', { class:'btn btn-primary btn-sm', text:'Add', onclick:save }));
    return wrap;
  }

  /* ---- full add form ---- */
  function quickAdd(prefillTitle){
    const body = el('div');
    const title = el('input', { class:'inp', placeholder:'What needs doing?', 'data-autofocus':'1', 'aria-label':'Title' });
    title.value = prefillTitle || '';
    body.appendChild(title);

    let priority = Store.get('defaultPriority') || 'medium';

    /* one tight 2-column grid - no scrolling on desktop */
    const grid = el('div', { class:'dt-grid', style:{ marginTop:'10px', gap:'10px 12px' } });

    grid.appendChild(fieldWrap('Priority', segPick(PRIORITIES, priority, v => { priority = v; })));

    const due = el('input', { class:'inp', type:'date', 'aria-label':'Due date' });
    grid.appendChild(fieldWrap('Due date', due));

    const cat = catSelect(Store.generalCatId(), null);
    grid.appendChild(fieldWrap('Category', cat));

    /* repeat: recurring tasks straight from the add form */
    const recWrap = el('div', { class:'field' });
    recWrap.appendChild(el('label', { text:'Repeat' }));
    const recLine = el('div', { style:{ display:'flex', gap:'6px' } });
    const recSel = el('select', { class:'sel', 'aria-label':'Repeat' });
    [['none','No repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']]
      .forEach(o => recSel.appendChild(el('option', { value:o[0], text:o[1] })));
    const recInt = el('input', { class:'inp', type:'number', min:'1', max:'99', value:'1',
      'aria-label':'Repeat interval', style:{ width:'64px', display:'none', flex:'none' } });
    recSel.addEventListener('change', () => {
      recInt.style.display = recSel.value === 'none' ? 'none' : '';
      /* a recurring task needs a due-date anchor - default to today, visibly */
      if (recSel.value !== 'none' && !due.value) due.value = todayKey();
    });
    recLine.appendChild(recSel);
    recLine.appendChild(recInt);
    recWrap.appendChild(recLine);
    grid.appendChild(recWrap);

    const asg = el('select', { class:'sel', 'aria-label':'Assigned by' });
    IDENTITIES.forEach(n => asg.appendChild(el('option', { value:n, text:displayName(n) })));
    asg.value = Store.identity() || 'Manan';
    grid.appendChild(fieldWrap('Assigned by', asg));

    const pwrap = el('div', { class:'field' });
    pwrap.appendChild(el('label', { text:'Personal (never synced)' }));
    const pline = el('label', { class:'switch', style:{ marginTop:'7px' } });
    const pchk = el('input', { type:'checkbox' });
    pline.appendChild(pchk); pline.appendChild(el('span', { class:'track' })); pline.appendChild(el('span', { class:'knob' }));
    pwrap.appendChild(pline);
    grid.appendChild(pwrap);

    body.appendChild(grid);

    const syncP = () => {
      const cc = Store.getCat(cat.value);
      if (cc && cc.personalOnly){ pchk.checked = true; pchk.disabled = true; }
      else pchk.disabled = false;
    };
    cat.addEventListener('change', syncP); syncP();

    const notes = el('textarea', { class:'txt', placeholder:'Notes…', rows:'2',
      style:{ marginTop:'10px', minHeight:'46px' }, 'aria-label':'Notes' });
    body.appendChild(notes);

    const foot = el('div', { style:{ display:'flex', gap:'8px' } });
    const submit = () => {
      const v = title.value.trim();
      if (!v){ title.focus(); return; }
      Tasks.create({
        title:v, notes:notes.value, priority:priority,
        category:cat.value, dueDate:due.value || null,
        assignedBy:asg.value, personal:pchk.checked,
        recurrence: recSel.value === 'none' ? null
          : { type:recSel.value, interval: clamp(parseInt(recInt.value, 10) || 1, 1, 99) }
      });
      Modal.close(inst);
      Toast.show(recSel.value === 'none' ? 'Task added.' : 'Task added - repeats ' + recSel.value + '.');
    };
    title.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } });
    foot.appendChild(el('button', { class:'btn btn-outline', text:'Cancel', onclick: () => Modal.close(inst) }));
    foot.appendChild(el('button', { class:'btn btn-primary', text:'Add task', onclick:submit }));
    const inst = Modal.open({ title:'New task', body:body, footer:foot });
  }

  /* ---- detail modal ---- */
  function openDetail(id){
    const t = Store.getTask(id); if (!t) return;
    const body = el('div', { class:'dt' });

    const subText = () => {
      const cur = Store.getTask(id);
      return 'Created by ' + displayName(cur.createdBy) + ' · ' + fmtDateTime(cur.createdAt) + ' · updated ' + relTime(cur.updatedAt);
    };

    const title = el('input', { class:'dt-title', 'aria-label':'Title', placeholder:'Task title' });
    title.value = t.title;
    body.appendChild(title);
    const sub = el('div', { class:'dt-sub', text:subText() });
    body.appendChild(sub);

    /* action bar: pin / duplicate / snooze */
    const actions = el('div', { class:'dt-actions' });
    const pinBtn = el('button', { class:'btn btn-outline btn-sm', onclick: () => {
      Tasks.togglePin(id); syncPin(); renderActivity(); sub.textContent = subText();
    } });
    function syncPin(){ pinBtn.textContent = Store.getTask(id).pinned ? '📌 Unpin' : '📌 Pin'; }
    syncPin();
    actions.appendChild(pinBtn);
    actions.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'⧉ Duplicate', onclick: () => {
      const cpy = Tasks.duplicate(id);
      if (cpy) Toast.show('Duplicated: ' + cpy.title);
    } }));
    actions.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'💤 Snooze', onclick: () => snoozeMenu(id) }));
    body.appendChild(actions);

    /* activity re-renderer (declared early, used by up()) */
    const act = el('details', { class:'act' });
    const asum = el('summary');
    const alist = el('ul');
    act.appendChild(asum); act.appendChild(alist);
    function renderActivity(){
      const cur = Store.getTask(id);
      asum.textContent = 'Activity (' + cur.activity.length + ')';
      alist.innerHTML = '';
      cur.activity.slice().reverse().forEach(a => {
        const li = el('li');
        li.appendChild(el('b', { text:displayName(a.who) }));
        li.appendChild(document.createTextNode(' ' + String(a.action).replace(/_/g, ' ') + (a.detail ? ' - ' + a.detail : '') + ' · '));
        li.appendChild(el('time', { text:fmtDateTime(a.at) }));
        alist.appendChild(li);
      });
    }

    function up(patch, label){
      Tasks.update(id, patch, label);
      renderActivity();
      sub.textContent = subText();
    }

    title.addEventListener('change', () => {
      const v = title.value.trim();
      if (v && v !== Store.getTask(id).title) up({ title:v }, 'title');
      else title.value = Store.getTask(id).title;
    });

    body.appendChild(el('div', { class:'dt-label', text:'Status' }));
    const statusSeg = segPick(STATUSES, t.status, v => {
      if (v === 'done') doneWithUndo(id);
      else Tasks.setStatus(id, v);
      renderActivity(); sub.textContent = subText(); syncFoot();
    });
    body.appendChild(statusSeg);

    body.appendChild(el('div', { class:'dt-label', text:'Priority' }));
    body.appendChild(segPick(PRIORITIES, t.priority, v => up({ priority:v }, 'priority')));

    body.appendChild(el('div', { class:'dt-label', text:'Details' }));
    const grid = el('div', { class:'dt-grid' });

    const catSel = catSelect(t.category, v => { up({ category:v }, 'category'); refreshPersonal(); });
    grid.appendChild(fieldWrap('Category', catSel));

    const due = el('input', { class:'inp', type:'date', 'aria-label':'Due date' });
    due.value = t.dueDate || '';
    due.addEventListener('change', () => up({ dueDate: due.value || null }, 'due date'));
    grid.appendChild(fieldWrap('Due date', due));

    const asg = el('select', { class:'sel', 'aria-label':'Assigned by' });
    IDENTITIES.forEach(n => asg.appendChild(el('option', { value:n, text:displayName(n) })));
    asg.value = t.assignedBy || Store.identity();
    asg.addEventListener('change', () => up({ assignedBy:asg.value }, 'assigned by'));
    grid.appendChild(fieldWrap('Assigned by', asg));

    const pwrap = el('div', { class:'field' });
    pwrap.appendChild(el('label', { text:'Personal (never synced)' }));
    const pline = el('label', { class:'switch', style:{ marginTop:'7px' } });
    const pchk = el('input', { type:'checkbox' });
    pline.appendChild(pchk); pline.appendChild(el('span', { class:'track' })); pline.appendChild(el('span', { class:'knob' }));
    pwrap.appendChild(pline);
    grid.appendChild(pwrap);
    body.appendChild(grid);

    function refreshPersonal(){
      const cur = Store.getTask(id);
      const cc = Store.getCat(cur.category);
      pchk.checked = !!cur.personal;
      pchk.disabled = !!(cc && cc.personalOnly);
    }
    pchk.addEventListener('change', () => { up({ personal:pchk.checked }, 'personal'); refreshPersonal(); });
    refreshPersonal();

    body.appendChild(el('div', { class:'dt-label', text:'Notes' }));
    const notes = el('textarea', { class:'txt', placeholder:'Notes…', 'aria-label':'Notes' });
    notes.value = t.notes || '';
    notes.addEventListener('change', () => up({ notes:notes.value }, 'notes'));
    body.appendChild(notes);

    /* subtasks */
    body.appendChild(el('div', { class:'dt-label', text:'Subtasks' }));
    const stWrap = el('div', { class:'st-list' });
    function renderSubtasks(){
      stWrap.innerHTML = '';
      const cur = Store.getTask(id);
      const arr = cur.subtasks || [];
      arr.forEach((st, i) => {
        const row = el('div', { class:'st-row' + (st.done ? ' done' : '') });
        row.appendChild(el('button', {
          class:'st-chk', 'aria-label':'Toggle subtask',
          html:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5L9.6 17 4 11.6"/></svg>',
          onclick: () => { Tasks.toggleSubtask(id, st.id); renderSubtasks(); }
        }));
        row.appendChild(el('span', { class:'st-text', text:st.text }));
        const upB = el('button', { class:'st-btn', text:'↑', 'aria-label':'Move up', onclick: () => { Tasks.moveSubtask(id, st.id, -1); renderSubtasks(); } });
        const dnB = el('button', { class:'st-btn', text:'↓', 'aria-label':'Move down', onclick: () => { Tasks.moveSubtask(id, st.id, 1); renderSubtasks(); } });
        if (i === 0) upB.disabled = true;
        if (i === arr.length - 1) dnB.disabled = true;
        row.appendChild(upB);
        row.appendChild(dnB);
        row.appendChild(el('button', { class:'st-btn st-del', text:'✕', 'aria-label':'Delete subtask',
          onclick: () => { Tasks.removeSubtask(id, st.id); renderSubtasks(); renderActivity(); } }));
        stWrap.appendChild(row);
      });
      if (!arr.length) stWrap.appendChild(el('div', { class:'dt-none', text:'No subtasks.' }));
    }
    renderSubtasks();
    body.appendChild(stWrap);
    const stRow = el('div', { style:{ display:'flex', gap:'8px' } });
    const stInp = el('input', { class:'inp', placeholder:'Add subtask…', 'aria-label':'New subtask' });
    const stAdd = () => {
      if (!stInp.value.trim()) return;
      Tasks.addSubtask(id, stInp.value);
      stInp.value = '';
      renderSubtasks(); renderActivity();
      stInp.focus();
    };
    stInp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); stAdd(); } });
    stRow.appendChild(stInp);
    stRow.appendChild(el('button', { class:'btn btn-sm', text:'Add', onclick:stAdd }));
    body.appendChild(stRow);

    /* links */
    body.appendChild(el('div', { class:'dt-label', text:'Links' }));
    const lkWrap = el('div', { class:'lk-list' });
    function renderLinks(){
      lkWrap.innerHTML = '';
      const cur = Store.getTask(id);
      (cur.links || []).forEach((lk, i) => {
        const row = el('div', { class:'lk-row' });
        const safeHref = /^https?:\/\//i.test(String(lk.url || ''));
        row.appendChild(safeHref
          ? el('a', { class:'lk-a', href:lk.url, target:'_blank', rel:'noopener noreferrer', text:lk.label || lk.url })
          : el('span', { class:'lk-a', text:(lk.label || String(lk.url || '')) + ' (invalid link)' }));
        row.appendChild(el('span', { class:'lk-url', text:lk.url }));
        row.appendChild(el('button', { class:'st-btn st-del', text:'✕', 'aria-label':'Remove link',
          onclick: () => { Tasks.removeLink(id, i); renderLinks(); renderActivity(); } }));
        lkWrap.appendChild(row);
      });
      if (!(cur.links || []).length) lkWrap.appendChild(el('div', { class:'dt-none', text:'No links.' }));
    }
    renderLinks();
    body.appendChild(lkWrap);
    const lkRow = el('div', { class:'lk-add' });
    const lkLabel = el('input', { class:'inp', placeholder:'Label', 'aria-label':'Link label' });
    const lkUrl = el('input', { class:'inp', placeholder:'https://…', 'aria-label':'Link URL' });
    const lkAdd = () => {
      if (!lkUrl.value.trim()) return;
      Tasks.addLink(id, lkLabel.value, lkUrl.value);
      lkLabel.value = ''; lkUrl.value = '';
      renderLinks(); renderActivity();
    };
    lkUrl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); lkAdd(); } });
    lkRow.appendChild(lkLabel);
    lkRow.appendChild(lkUrl);
    lkRow.appendChild(el('button', { class:'btn btn-sm', text:'Add', onclick:lkAdd }));
    body.appendChild(lkRow);

    /* attachments */
    body.appendChild(el('div', { class:'dt-label', text:'Attachments' }));
    const attGrid = el('div', { class:'att-grid' });
    function renderAttachments(){
      attGrid.innerHTML = '';
      const cur = Store.getTask(id);
      const list = (cur && cur.attachments) || [];
      list.forEach(a => {
        const tile = el('div', { class:'att-tile' + (a.pending ? ' pending' : ''), title:a.name, role:'button', tabindex:'0',
          onclick: () => {
            if (a.pending){ Toast.show('Still uploading - link not ready yet.'); return; }
            if (a.driveUrl && /^https?:\/\//i.test(a.driveUrl)) window.open(a.driveUrl, '_blank', 'noopener');
          } });
        if (a.type === 'image' && a.thumbUrl){
          const img = el('img', { class:'att-img', alt:a.name, loading:'lazy' });
          img.src = a.thumbUrl;
          img.onerror = () => { if (img.parentNode) img.replaceWith(el('div', { class:'att-ico', text:'🖼' })); };
          tile.appendChild(img);
        } else {
          tile.appendChild(el('div', { class:'att-ico',
            text: a.type === 'image' ? '🖼' : (a.type === 'pdf' ? '📄' : '📦') }));
        }
        tile.appendChild(el('div', { class:'att-name', text:a.name }));
        tile.appendChild(el('div', { class:'att-meta', text: a.pending ? '⏳ pending upload' : ('by ' + displayName(a.uploadedBy)) }));
        tile.appendChild(el('button', { class:'att-del', text:'✕', 'aria-label':'Remove attachment',
          onclick: e => { e.stopPropagation(); Attach.remove(id, a.id); renderAttachments(); renderActivity(); } }));
        attGrid.appendChild(tile);
      });
      if (!list.length) attGrid.appendChild(el('div', { class:'dt-none', text:'No attachments. Add a file, use the camera, or paste a screenshot.' }));
    }
    renderAttachments();
    body.appendChild(attGrid);

    const attRow = el('div', { class:'att-row' });
    const fileInp = el('input', { type:'file', multiple:true, class:'hidden', 'aria-label':'Add files' });
    fileInp.addEventListener('change', () => { Attach.addFiles(id, fileInp.files); fileInp.value = ''; });
    const camInp = el('input', { type:'file', class:'hidden', 'aria-label':'Camera capture' });
    camInp.setAttribute('accept', 'image/*');
    camInp.setAttribute('capture', 'environment');
    camInp.addEventListener('change', () => { Attach.addFiles(id, camInp.files); camInp.value = ''; });
    attRow.appendChild(fileInp);
    attRow.appendChild(camInp);
    attRow.appendChild(el('button', { class:'btn btn-sm', text:'📁 Add file', onclick: () => fileInp.click() }));
    attRow.appendChild(el('button', { class:'btn btn-sm', text:'📷 Camera', onclick: () => camInp.click() }));
    attRow.appendChild(el('span', { class:'dt-none', text:'or paste a screenshot (Ctrl+V)' }));
    body.appendChild(attRow);

    /* paste screenshot while this detail is open */
    const onPaste = e => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      const files = [];
      for (let i = 0; i < items.length; i++){
        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0){
          const f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length){
        e.preventDefault();
        Attach.addFiles(id, files, 'screenshot');
      }
    };
    document.addEventListener('paste', onPaste);
    const unsubAtt = Attach.subscribe(tid => { if (tid === id){ renderAttachments(); renderActivity(); } });

    /* recurrence */
    body.appendChild(el('div', { class:'dt-label', text:'Recurrence' }));
    const recRow = el('div', { class:'rec-row' });
    const recSel = el('select', { class:'sel', 'aria-label':'Recurrence type' });
    [['none','No repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']]
      .forEach(o => recSel.appendChild(el('option', { value:o[0], text:o[1] })));
    const recInt = el('input', { class:'inp', type:'number', min:'1', max:'99', 'aria-label':'Interval', style:{ width:'76px' } });
    const recHint = el('div', { class:'dt-none', style:{ marginTop:'4px' } });
    const rec0 = Store.getTask(id).recurrence;
    recSel.value = (rec0 && rec0.type) || 'none';
    recInt.value = (rec0 && rec0.interval) || 1;
    function syncRec(){
      const on = recSel.value !== 'none';
      recInt.style.display = on ? '' : 'none';
      recHint.textContent = on
        ? 'On completion, the next instance is created ' + recInt.value + ' '
          + (recSel.value === 'daily' ? 'day(s)' : recSel.value === 'weekly' ? 'week(s)' : 'month(s)')
          + ' after the due date.'
        : 'One-time task.';
    }
    function applyRec(){
      const v = recSel.value;
      const n = clamp(parseInt(recInt.value, 10) || 1, 1, 99);
      recInt.value = n;
      Tasks.update(id, { recurrence: v === 'none' ? null : { type:v, interval:n } }, 'recurrence');
      renderActivity(); sub.textContent = subText(); syncRec();
    }
    recSel.addEventListener('change', applyRec);
    recInt.addEventListener('change', applyRec);
    syncRec();
    recRow.appendChild(recSel);
    recRow.appendChild(recInt);
    body.appendChild(recRow);
    body.appendChild(recHint);

    /* comments */
    body.appendChild(el('div', { class:'dt-label', text:'Comments' }));
    const cwrap = el('div', { class:'cmt-list' });
    function renderComments(){
      cwrap.innerHTML = '';
      const cur = Store.getTask(id);
      (cur.comments || []).forEach(cm => {
        cwrap.appendChild(el('div', { class:'cmt' }, [
          el('div', { class:'cmt-head' }, [
            el('span', { class:'cmt-author', text:displayName(cm.author) }),
            el('span', { text:fmtDateTime(cm.at) })
          ]),
          el('div', { class:'cmt-text', text:cm.text })
        ]));
      });
      if (!(cur.comments || []).length) cwrap.appendChild(el('div', { class:'dt-none', text:'No comments yet.' }));
    }
    renderComments();
    body.appendChild(cwrap);
    const crow = el('div', { style:{ display:'flex', gap:'8px' } });
    const cinp = el('input', { class:'inp', placeholder:'Write a comment…', 'aria-label':'New comment' });
    const post = () => {
      if (!cinp.value.trim()) return;
      Tasks.addComment(id, cinp.value);
      cinp.value = '';
      renderComments(); renderActivity(); sub.textContent = subText();
    };
    cinp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); post(); } });
    crow.appendChild(cinp);
    crow.appendChild(el('button', { class:'btn btn-sm', text:'Post', onclick:post }));
    body.appendChild(crow);

    renderActivity();
    body.appendChild(act);

    /* footer */
    const foot = el('div', { style:{ display:'flex', gap:'8px', width:'100%' } });
    foot.appendChild(el('button', { class:'btn btn-danger btn-sm', text:'Delete', onclick: () => {
      Modal.close(inst);
      deleteWithUndo(id);
    } }));
    foot.appendChild(el('span', { style:{ flex:'1' } }));
    const doneBtn = el('button', { class:'btn btn-primary', onclick: () => {
      toggleDone(id);
      statusSeg._set(Store.getTask(id).status);
      syncFoot(); renderActivity(); sub.textContent = subText();
    } });
    function syncFoot(){
      doneBtn.textContent = Store.getTask(id).status === 'done' ? 'Reopen' : 'Mark done';
    }
    syncFoot();
    foot.appendChild(doneBtn);

    const inst = Modal.open({ title:'Task details', body:body, footer:foot, autofocus:false,
      onClose: () => { document.removeEventListener('paste', onPaste); unsubAtt(); } });
  }

  return { card:card, list:list, emptyState:emptyState, quickAddBar:quickAddBar,
           quickAdd:quickAdd, openDetail:openDetail, toggleDone:toggleDone,
           doneWithUndo:doneWithUndo, deleteWithUndo:deleteWithUndo, snoozeMenu:snoozeMenu };
})();

let _refocusSel = null;
function refocus(sel){ _refocusSel = sel; }

function refreshCounts(){
  const open = Tasks.open();
  const overdue = open.filter(Tasks.isOverdue).length;
  Shell.setCounts({
    today: overdue + open.filter(Tasks.isDueToday).length,
    all: open.length,
    done: Tasks.all().filter(t => t.status === 'done').length,
    board: null,
    stats: null,
    _overdue: overdue > 0
  });
  const cc = {};
  open.forEach(t => { cc[t.category] = (cc[t.category] || 0) + 1; });
  Shell.setCatCounts(cc);
}

Store.onChange(function(what){
  if (what === 'tasks' || what === 'all'){
    refreshCounts();
    /* the settings view shows no tasks - skip re-render so form inputs keep focus during background sync */
    if (Router.state.view !== 'settings' || what === 'all') Router.render();
    if (_refocusSel){
      const n = $(_refocusSel);
      if (n) n.focus();
      _refocusSel = null;
    }

    refreshCounts();
  }
});

Views.today = function(mount){
  const view = el('div', { class:'view' });
  const tk = todayKey();
  view.appendChild(el('div', { class:'view-head' }, [
    el('h1', { class:'view-title', text:'Today' }),
    el('span', { class:'view-sub', text: WEEKDAYS[weekdayOfKey(tk)] + ' · ' + fmtDate(tk) })
  ]));
  view.appendChild(TaskUI.quickAddBar());

  const open = Tasks.open().sort(Tasks.cmp('due'));
  const shown = new Set();
  const take = pred => open.filter(t => !shown.has(t.id) && pred(t)).map(t => { shown.add(t.id); return t; });

  const overdue  = take(Tasks.isOverdue);
  const dueToday = take(Tasks.isDueToday);
  const pinned   = take(t => t.pinned);
  const nodue    = take(t => t.status === 'inprogress' && !t.dueDate);

  const sec = (icon, label, tasks, cls) => {
    if (!tasks.length) return;
    const s = el('section', { class:'tsec' });
    s.appendChild(el('div', { class:'tsec-head' + (cls ? ' ' + cls : '') }, [
      el('span', { class:'tsec-title', text:icon + ' ' + label }),
      el('span', { class:'tsec-count', text:tasks.length })
    ]));
    s.appendChild(TaskUI.list(tasks));
    view.appendChild(s);
  };

  sec('🔴', 'Overdue', overdue, 'is-over');
  sec('📅', 'Due Today', dueToday);
  sec('📌', 'Pinned', pinned);
  sec('⚙️', 'In Progress - no due date', nodue);

  if (!overdue.length && !dueToday.length && !pinned.length && !nodue.length){
    view.appendChild(TaskUI.emptyState({
      icon:'☀️', title:'All clear for today',
      text: open.length
        ? 'Nothing due or overdue. ' + open.length + ' open task' + (open.length > 1 ? 's' : '') + ' waiting in All Tasks.'
        : 'No open tasks. Add one above and get moving.'
    }));
  }
  mount.appendChild(view);
};

    { id:'from',     label:'From ' + displayName(otherId),  f:Tasks.fromOther },
    { id:'waiting',  label:'Waiting',        f:t => t.status === 'waiting' },
    { id:'personal', label:'Personal',       f:t => !!t.personal }
  ];

  /* --- filter pipeline --- */

  if (AllState.fPriority) list = list.filter(t => t.priority === AllState.fPriority);
  if (AllState.fCat)      list = list.filter(t => t.category === AllState.fCat);
  if (AllState.fBy)       list = list.filter(t => t.assignedBy === AllState.fBy);
  if (AllState.fAtt)      list = list.filter(t => t.attachments && t.attachments.length);
  list = list.slice().sort(Tasks.cmp(Store.get('sortBy') || 'due'));

  view.appendChild(head);

  const chipRow = el('div', { class:'chips' });

    chipRow.appendChild(el('button', {

      onclick: () => { AllState.chips[c.id] = !AllState.chips[c.id]; Router.render(); }
    }));
  });
  view.appendChild(chipRow);

  /* --- controls: filters panel toggle, sort, group --- */
  const nFilters = ['fStatus','fPriority','fCat','fBy','fAtt'].filter(k => AllState[k]).length;
  const bar = el('div', { class:'ctrlbar' });
  bar.appendChild(el('button', {
    class:'btn btn-sm' + (AllState.panelOpen ? '' : ' btn-outline'),
    onclick: () => { AllState.panelOpen = !AllState.panelOpen; Router.render(); }
  }, [ 'Filters', nFilters ? el('span', { class:'fbadge', text:nFilters }) : null ]));
  bar.appendChild(miniSel('Sort', [['due','Sort: Due date'],['priority','Sort: Priority'],['created','Sort: Created'],['updated','Sort: Updated']],
    Store.get('sortBy') || 'due', v => { Store.set('sortBy', v); Router.render(); }));
  bar.appendChild(miniSel('Group', [['flat','Group: Flat'],['status','Group: Status'],['category','Group: Category']],
    Store.get('groupBy') || 'flat', v => { Store.set('groupBy', v); Router.render(); }));
  bar.appendChild(el('button', { class:'btn btn-outline btn-sm', text:'Print', onclick: () => printAllTasks() }));
  view.appendChild(bar);

  if (AllState.panelOpen){
    const pan = el('div', { class:'fpanel' });
    pan.appendChild(fieldWrap('Status', miniSel('Status filter',
      [['','Any']].concat(STATUSES.map(s => [s.id, s.label])), AllState.fStatus, v => { AllState.fStatus = v; Router.render(); })));
    pan.appendChild(fieldWrap('Priority', miniSel('Priority filter',
      [['','Any']].concat(PRIORITIES.map(p => [p.id, p.label])), AllState.fPriority, v => { AllState.fPriority = v; Router.render(); })));
    pan.appendChild(fieldWrap('Category', miniSel('Category filter',
      [['','Any']].concat(Store.cats().map(c => [c.id, c.name])), AllState.fCat, v => { AllState.fCat = v; Router.render(); })));
    pan.appendChild(fieldWrap('Assigned by', miniSel('Assigned by filter',
      [['','Any']].concat(IDENTITIES.map(n => [n, displayName(n)])), AllState.fBy, v => { AllState.fBy = v; Router.render(); })));
    pan.appendChild(fieldWrap('Attachments', miniSel('Attachments filter',
      [['','Any'],['1','Has attachments']], AllState.fAtt, v => { AllState.fAtt = v; Router.render(); })));

      el('label', { text:' ' }),

        Router.render();
      } })
    ]));
    view.appendChild(pan);
  }

  const group = Store.get('groupBy') || 'flat';
  const emptyO = Tasks.all().length
    ? { icon:'🔍', title:'No matches', text:'Nothing fits the current search or filters.' }
    : { icon:'🗒', title:'No tasks yet', text:'Add your first task above - Enter saves instantly.' };

  if (!list.length){
    view.appendChild(TaskUI.emptyState(emptyO));
  } else if (group === 'status'){
    STATUSES.forEach(s => {
      const g = list.filter(t => t.status === s.id);

      view.appendChild(groupHead(c.name, g.length, c.color));
      view.appendChild(TaskUI.list(g));
    });

    if (rest.length){
      view.appendChild(groupHead('Other', rest.length, 'var(--text-faint)'));
      view.appendChild(TaskUI.list(rest));
    }
  } else {
    view.appendChild(TaskUI.list(list));
  }

  mount.appendChild(view);
};

const BoardState = { expanded:null };

Views.board = function(mount){
  const view = el('div', { class:'view', style:{ maxWidth:'none' } });
  const openCount = Tasks.open().length;
  view.appendChild(el('div', { class:'view-head' }, [
    el('h1', { class:'view-title', text:'Board' }),
    el('span', { class:'view-sub', text:openCount + ' open' })
  ]));

  const isMobile = window.matchMedia('(max-width:899px)').matches;
  const board = el('div', { class:'board' });
  const tasks = Tasks.all().slice().sort(Tasks.cmp('due'));
  const cutoff7 = addDaysKey(todayKey(), -6);     /* Done column: last 7 days */

  STATUSES.forEach(st => {
    let colTasks = tasks.filter(t => t.status === st.id);
    let older = 0;
    if (st.id === 'done'){
      const total = colTasks.length;
      colTasks = colTasks.filter(t => t.completedAt && istDateKey(new Date(t.completedAt)) >= cutoff7);
      older = total - colTasks.length;
    }

    const col = el('div', { class:'bcol', 'data-status':st.id });
    col.appendChild(el('div', { class:'bcol-head' }, [
      el('span', { class:'cat-dot', style:{ background:st.color } }),
      el('span', { class:'bcol-title', text:st.label }),
      el('span', { class:'tsec-count', text:colTasks.length })
    ]));

    const lane = el('div', { class:'tlist' });
    colTasks.forEach(t => lane.appendChild(boardCard(t)));
    if (!colTasks.length) lane.appendChild(el('div', { class:'bcol-empty', text:'-' }));
    col.appendChild(lane);

    if (st.id === 'done'){
      col.appendChild(el('button', {
        class:'btn btn-outline btn-sm btn-block', style:{ marginTop:'8px' },
        text:'Done archive' + (older ? ' · ' + older + ' older' : '') + ' →',
        onclick: () => Router.go('done')
      }));
    }

    if (!isMobile){
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', () => col.classList.remove('dragover'));
      col.addEventListener('drop', e => {
        e.preventDefault();
        col.classList.remove('dragover');
        const tid = e.dataTransfer.getData('text/plain');
        const task = tid && Store.getTask(tid);
        if (!task || task.status === st.id) return;
        if (st.id === 'done') TaskUI.doneWithUndo(tid);
        else Tasks.setStatus(tid, st.id);
      });
    }
    board.appendChild(col);
  });

  view.appendChild(board);
  mount.appendChild(view);

  function boardCard(t){
    const c = TaskUI.card(t, {
      noSwipe:true,
      draggable:!isMobile,
      onClick: isMobile
        ? () => { BoardState.expanded = BoardState.expanded === t.id ? null : t.id; Router.render(); }
        : undefined
    });
    if (isMobile && BoardState.expanded === t.id){
      const chipsRow = el('div', { class:'bstatus' });
      STATUSES.forEach(s2 => {
        chipsRow.appendChild(el('button', {
          class:'chip' + (s2.id === t.status ? ' on' : ''), text:s2.label,
          onclick: e => {
            e.stopPropagation();
            if (s2.id === t.status) return;
            BoardState.expanded = null;
            if (s2.id === 'done') TaskUI.doneWithUndo(t.id);
            else Tasks.setStatus(t.id, s2.id);
          }
        }));
      });
      chipsRow.appendChild(el('button', { class:'chip', text:'Details',
        onclick: e => { e.stopPropagation(); TaskUI.openDetail(t.id); } }));
      const wrap = el('div', { class:'bexp' });
      wrap.appendChild(c);
      wrap.appendChild(chipsRow);
      return wrap;
    }
    return c;
  }
};

  if (!done.length){
